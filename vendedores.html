<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Equipo de Ventas | Multiamerica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Montserrat:ital,wght@1,900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --neu-bg: #e7e8ee;
            --neu-text: #35354a;
            --neu-text-muted: #8890a3;
            --neu-light: #ffffff;
            --neu-dark: #c3c5d1;
            --neu-accent: linear-gradient(135deg, #ff9d3d, #ff8801);
        }
        body { background-color: var(--neu-bg); color: var(--neu-text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .font-title { font-family: 'Montserrat', sans-serif; font-weight: 900; font-style: italic; letter-spacing: -0.04em; }
        .text-muted { color: var(--neu-text-muted); }

        .neu-card { background: var(--neu-bg); border-radius: 24px; box-shadow: 8px 8px 16px var(--neu-dark), -8px -8px 16px var(--neu-light); transition: all 0.25s ease; }
        .neu-card-sm { background: var(--neu-bg); border-radius: 18px; box-shadow: 6px 6px 12px var(--neu-dark), -6px -6px 12px var(--neu-light); transition: all 0.2s ease; }
        .neu-inset { background: var(--neu-bg); border-radius: 14px; box-shadow: inset 3px 3px 7px var(--neu-dark), inset -3px -3px 7px var(--neu-light); }
        .neu-pressable:active { box-shadow: inset 4px 4px 9px var(--neu-dark), inset -4px -4px 9px var(--neu-light); transform: scale(0.98); }
        .neu-accent { background: var(--neu-accent); box-shadow: 6px 6px 14px rgba(200,110,10,0.28), -4px -4px 10px rgba(255,255,255,0.7); color: #fff; }

        .accordion-header { cursor: pointer; user-select: none; }
        .accordion-content { transition: max-height 0.3s ease-out; overflow: hidden; max-height: 2000px; }
        .accordion-content.collapsed { max-height: 0; }
        .chevron { transition: transform 0.3s ease; }
        .chevron.collapsed { transform: rotate(-90deg); }
        .modal-enter { animation: modalIn 0.3s ease-out forwards; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF8801">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Central">
</head>
<body class="min-h-screen pb-12">

    <main class="max-w-[1000px] mx-auto p-4 md:p-8">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 sm:gap-6 mb-6 sm:mb-10 pt-2">
            <div>
                <a href="dashboard.html" class="inline-flex items-center gap-2 text-muted hover:text-orange-600 font-black uppercase text-[10px] tracking-widest mb-2 transition-colors">
                    ← Volver a Central
                </a>
                <h1 class="text-4xl sm:text-6xl md:text-8xl font-title uppercase leading-[0.85] tracking-tight text-[#FF8801]">VENTAS.</h1>
            </div>
            <div class="w-full md:w-auto">
                <input type="text" id="buscador" placeholder="Buscar asesor o equipo..."
                    class="neu-inset w-full md:w-72 text-xs p-4 rounded-full outline-none font-bold uppercase"
                    onkeyup="filtrarVendedores()">
            </div>
        </header>

        <div class="grid grid-cols-2 gap-3 sm:gap-4 mb-6 sm:mb-10">
            <div class="neu-card p-4 sm:p-6 flex flex-col justify-between">
                <span class="text-[8px] sm:text-[9px] font-black text-muted uppercase tracking-widest">Total Asesores</span>
                <span class="text-2xl sm:text-4xl font-title italic mt-2" id="kpi-asesores">0</span>
            </div>
            <div class="neu-card p-4 sm:p-6 flex flex-col justify-between">
                <span class="text-[8px] sm:text-[9px] font-black text-muted uppercase tracking-widest">Equipos Activos</span>
                <span class="text-2xl sm:text-4xl font-title italic mt-2 text-[#FF8801]" id="kpi-equipos">0</span>
            </div>
        </div>

        <div id="contenedor-equipos" class="space-y-6">
            <div class="text-center py-10 text-muted font-bold uppercase text-xs italic">Sincronizando estructura de mando...</div>
        </div>
    </main>

    <div id="modal-reasignar" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/60 backdrop-blur-md">
        <div class="neu-card w-full max-w-sm p-6 sm:p-8 modal-enter">
            <h3 class="text-2xl font-title italic uppercase text-[#FF8801] mb-1">Mover Asesor</h3>
            <p class="text-[10px] font-black uppercase tracking-widest text-muted mb-6 italic" id="reasignar-nombre-asesor">--</p>

            <div class="space-y-4 text-left mb-8">
                <div>
                    <label class="text-[9px] font-black uppercase text-muted mb-2 block ml-2">Seleccionar Nuevo Gerente</label>
                    <select id="select-gerente" class="neu-inset w-full text-xs font-bold uppercase p-4 outline-none cursor-pointer">
                        </select>
                </div>
            </div>

            <input type="hidden" id="hidden-asesor-slug">

            <div class="grid grid-cols-2 gap-3 w-full mt-4">
                <button onclick="cerrarModal('modal-reasignar')" class="neu-card-sm neu-pressable text-muted p-4 text-[10px] font-black uppercase tracking-widest">Cancelar</button>
                <button onclick="guardarReasignacion()" class="neu-accent neu-pressable p-4 rounded-[18px] text-[10px] font-black uppercase tracking-widest">Confirmar Cambio</button>
            </div>
        </div>
    </div>

    <div id="modal-contacto" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/60 backdrop-blur-md">
        <div class="neu-card w-full max-w-sm p-6 sm:p-8 modal-enter">
            <h3 class="text-2xl font-title italic uppercase text-[#FF8801] mb-1">Editar Contacto</h3>
            <p class="text-[10px] font-black uppercase tracking-widest text-muted mb-6 italic" id="contacto-nombre-asesor">--</p>

            <div class="space-y-4 text-left mb-8">
                <div>
                    <label class="text-[9px] font-black uppercase text-muted mb-2 block ml-2">Email (para notificar leads asignados)</label>
                    <input type="email" id="input-contacto-email" placeholder="gerente@correo.com"
                        class="neu-inset w-full text-xs font-bold p-4 outline-none">
                </div>
            </div>

            <input type="hidden" id="hidden-contacto-slug">

            <div class="grid grid-cols-2 gap-3 w-full mt-4">
                <button onclick="cerrarModal('modal-contacto')" class="neu-card-sm neu-pressable text-muted p-4 text-[10px] font-black uppercase tracking-widest">Cancelar</button>
                <button onclick="guardarContacto()" class="neu-accent neu-pressable p-4 rounded-[18px] text-[10px] font-black uppercase tracking-widest">Guardar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const _supabase = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
        const userRol = localStorage.getItem('operador_rol');
        let todosLosVendedores = [];

        async function initApp() {
            if (!localStorage.getItem('operador_email')) { window.location.href = 'index.html'; return; }
            await cargarVendedores();
        }

        async function cargarVendedores() {
            const { data, error } = await _supabase.from('vendedores').select('*').order('nombre', { ascending: true });
            if (error) return console.error("Error:", error);

            todosLosVendedores = data || [];
            actualizarKPIs();
            renderizarEquipos(todosLosVendedores);
        }

        function actualizarKPIs() {
            document.getElementById('kpi-asesores').innerText = todosLosVendedores.length;
            const gerenciasUnicas = new Set(todosLosVendedores.map(v => v.gerente_id).filter(id => id));
            const tieneDirectos = todosLosVendedores.some(v => !v.gerente_id);
            document.getElementById('kpi-equipos').innerText = gerenciasUnicas.size + (tieneDirectos ? 1 : 0);
        }

        function renderizarEquipos(listaFiltrada) {
            const contenedor = document.getElementById('contenedor-equipos');
            contenedor.innerHTML = '';

            if(listaFiltrada.length === 0) {
                contenedor.innerHTML = `<div class="text-center py-10 text-muted font-bold uppercase text-xs">Sin registros</div>`;
                return;
            }

            // Agrupación por Gerente (usando su slug como llave)
            const equipos = { 'directos': { nombreGerente: 'VENDEDORES DIRECTOS / GERENCIA GENERAL', miembros: [] } };

            listaFiltrada.forEach(v => {
                if (!v.gerente_id) {
                    equipos['directos'].miembros.push(v);
                } else {
                    if (!equipos[v.gerente_id]) {
                        const gerenteObj = todosLosVendedores.find(g => g.slug === v.gerente_id);
                        const nombreG = gerenteObj ? `${gerenteObj.nombre} ${gerenteObj.apellido || ''}` : 'Gerencia Externa';
                        equipos[v.gerente_id] = { nombreGerente: `EQUIPO: ${nombreG.toUpperCase()}`, miembros: [] };
                    }
                    equipos[v.gerente_id].miembros.push(v);
                }
            });

            for (const [idEquipo, equipo] of Object.entries(equipos)) {
                if (equipo.miembros.length === 0) continue;

                const isAdmin = userRol === 'admin';

                let htmlEquipo = `
                <div class="mb-4">
                    <div class="neu-card-sm neu-pressable p-4 sm:p-5 flex items-center justify-between accordion-header gap-3" onclick="toggleAccordion('acc-${idEquipo}', 'chev-${idEquipo}')">
                        <div class="min-w-0">
                            <h2 class="text-sm sm:text-xl font-title italic uppercase tracking-tighter truncate">${equipo.nombreGerente}</h2>
                            <p class="text-[8px] sm:text-[9px] font-black text-muted uppercase tracking-widest mt-1">${equipo.miembros.length} Asesores bajo mando</p>
                        </div>
                        <svg id="chev-${idEquipo}" class="w-5 h-5 text-muted chevron flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                    <div id="acc-${idEquipo}" class="accordion-content mt-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                `;

                equipo.miembros.forEach(asesor => {
                    const statusColor = asesor.activo ? 'bg-green-400' : 'bg-red-400';
                    const isGerente = asesor.rol === 'gerente';
                    const btnAdmin = isAdmin
                        ? `<button onclick="abrirModalReasignacion('${asesor.slug}', '${asesor.nombre} ${asesor.apellido || ''}', '${asesor.gerente_id || ''}')" class="text-[9px] font-black text-[#FF8801] uppercase hover:tracking-widest transition-all mt-4 block">⟲ Mover de Equipo</button>`
                        : '';

                    htmlEquipo += `
                        <div class="neu-card-sm p-5">
                            <div class="flex justify-between items-start mb-4">
                                <div class="min-w-0">
                                    <div class="flex items-center gap-2">
                                        <h3 class="font-black text-xs uppercase truncate">${asesor.nombre} ${asesor.apellido || ''}</h3>
                                        ${isGerente ? '<span class="bg-black text-white text-[7px] px-2 py-0.5 rounded-full font-black uppercase flex-shrink-0">Gerente</span>' : ''}
                                    </div>
                                    <p class="text-[8px] font-mono font-bold text-muted uppercase tracking-widest mt-1">ID: ${asesor.slug}</p>
                                </div>
                                <div class="w-2.5 h-2.5 rounded-full ${statusColor} flex-shrink-0"></div>
                            </div>
                            <div class="space-y-2">
                                <div class="neu-inset p-3 flex justify-between items-center">
                                    <span class="text-[8px] font-black text-muted uppercase tracking-widest">WhatsApp</span>
                                    <span class="text-[10px] font-mono font-bold">${asesor.whatsapp || '---'}</span>
                                </div>
                                ${isGerente ? `
                                <div class="neu-inset p-3 flex justify-between items-center gap-2">
                                    <span class="text-[8px] font-black text-muted uppercase tracking-widest flex-shrink-0">Email</span>
                                    <span class="text-[9px] font-mono font-bold truncate">${asesor.email || 'Sin definir'}</span>
                                </div>` : ''}
                            </div>
                            ${isGerente && isAdmin ? `<button onclick="abrirModalContacto('${asesor.slug}', '${asesor.nombre} ${asesor.apellido || ''}', '${asesor.email || ''}')" class="text-[9px] font-black text-muted uppercase hover:text-[#FF8801] hover:tracking-widest transition-all mt-3 block">✎ Editar Email</button>` : ''}
                            ${btnAdmin}
                        </div>`;
                });

                htmlEquipo += `</div></div>`;
                contenedor.innerHTML += htmlEquipo;
            }
        }

        function toggleAccordion(contentId, chevronId) {
            document.getElementById(contentId).classList.toggle('collapsed');
            document.getElementById(chevronId).classList.toggle('collapsed');
        }

        function filtrarVendedores() {
            const texto = document.getElementById('buscador').value.toLowerCase();
            const filtrados = todosLosVendedores.filter(v =>
                `${v.nombre} ${v.apellido || ''}`.toLowerCase().includes(texto) ||
                v.slug.toLowerCase().includes(texto)
            );
            renderizarEquipos(filtrados);
        }

        function abrirModalReasignacion(asesorSlug, asesorNombre, gerenteActualId) {
            document.getElementById('reasignar-nombre-asesor').innerText = `MODIFICANDO A: ${asesorNombre}`;
            document.getElementById('hidden-asesor-slug').value = asesorSlug;

            const select = document.getElementById('select-gerente');
            select.innerHTML = `<option value="null">-- VENTA DIRECTA (GERENCIA GENERAL) --</option>`;

            // Solo mostramos como opciones a quienes tienen rol 'gerente' en la DB
            todosLosVendedores.filter(v => v.rol === 'gerente').forEach(v => {
                if (v.slug !== asesorSlug) {
                    const isSelected = (v.slug === gerenteActualId) ? 'selected' : '';
                    select.innerHTML += `<option value="${v.slug}" ${isSelected}>${v.nombre} ${v.apellido || ''}</option>`;
                }
            });

            document.getElementById('modal-reasignar').classList.remove('hidden');
        }

        function cerrarModal(id) { document.getElementById(id).classList.add('hidden'); }

        function abrirModalContacto(slug, nombre, emailActual) {
            document.getElementById('contacto-nombre-asesor').innerText = `MODIFICANDO A: ${nombre}`;
            document.getElementById('hidden-contacto-slug').value = slug;
            document.getElementById('input-contacto-email').value = emailActual;
            document.getElementById('modal-contacto').classList.remove('hidden');
        }

        async function guardarContacto() {
            const slug = document.getElementById('hidden-contacto-slug').value;
            const email = document.getElementById('input-contacto-email').value.trim();

            const btn = event.target;
            btn.innerText = "GUARDANDO..."; btn.disabled = true;

            try {
                const { error } = await _supabase.from('vendedores').update({ email: email || null }).eq('slug', slug);
                if (error) throw error;
                cerrarModal('modal-contacto');
                await cargarVendedores();
            } catch (error) {
                alert("Error de red: " + error.message);
            } finally {
                btn.innerText = "GUARDAR"; btn.disabled = false;
            }
        }

        async function guardarReasignacion() {
            const asesorSlug = document.getElementById('hidden-asesor-slug').value;
            let nuevoGerenteId = document.getElementById('select-gerente').value;
            if (nuevoGerenteId === 'null') nuevoGerenteId = null;

            const btn = event.target;
            btn.innerText = "PROCESANDO..."; btn.disabled = true;

            try {
                const { error } = await _supabase.from('vendedores').update({ gerente_id: nuevoGerenteId }).eq('slug', asesorSlug);
                if (error) throw error;
                cerrarModal('modal-reasignar');
                await cargarVendedores();
            } catch (error) {
                alert("Error de red: " + error.message);
            } finally {
                btn.innerText = "CONFIRMAR CAMBIO"; btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
        }
    </script>
</body>
</html>
