<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Inventario Stock | Multiamerica</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@1,900&family=Montserrat:wght@400;700;900&family=Roboto+Mono&display=swap" rel="stylesheet"/>

    <style>
        :root {
            --neu-bg: #e7e8ee;
            --neu-text: #35354a;
            --neu-text-muted: #8890a3;
            --neu-light: #ffffff;
            --neu-dark: #c3c5d1;
            --neu-accent: linear-gradient(135deg, #ff9d3d, #ff8801);
        }
        body { background-color: var(--neu-bg); color: var(--neu-text); font-family: 'Montserrat', sans-serif; }
        .font-epilogue { font-family: 'Epilogue', sans-serif; }
        .text-orange-envolvia { color: #FF8801; }
        .text-muted { color: var(--neu-text-muted); }

        .neu-card { background: var(--neu-bg); border-radius: 26px; box-shadow: 8px 8px 16px var(--neu-dark), -8px -8px 16px var(--neu-light); transition: box-shadow .25s ease, transform .25s ease; }
        .neu-card-sm { background: var(--neu-bg); border-radius: 18px; box-shadow: 6px 6px 12px var(--neu-dark), -6px -6px 12px var(--neu-light); transition: box-shadow .25s ease, transform .15s ease; }
        .neu-inset { background: var(--neu-bg); border-radius: 18px; box-shadow: inset 4px 4px 9px var(--neu-dark), inset -4px -4px 9px var(--neu-light); }
        .neu-pressable:active { box-shadow: inset 4px 4px 9px var(--neu-dark), inset -4px -4px 9px var(--neu-light); transform: scale(0.98); }
        .neu-icon-plate { background: var(--neu-bg); border-radius: 14px; box-shadow: 4px 4px 8px var(--neu-dark), -4px -4px 8px var(--neu-light); }
        .neu-accent { background: var(--neu-accent); box-shadow: 6px 6px 14px rgba(200,110,10,0.28), -4px -4px 10px rgba(255,255,255,0.7); color: #fff; }
        .neu-dark { background: #23232e; border-radius: 26px; box-shadow: 8px 8px 16px var(--neu-dark), -8px -8px 16px var(--neu-light); color: #fff; }

        .car-card:hover { transform: translateY(-6px); }

        @media print { .no-print { display: none !important; } }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF8801">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Central">
</head>
<body class="pb-20">

    <img id="img-header" src="encabezado.jpeg" class="hidden" crossorigin="anonymous">

    <header class="max-w-[1600px] mx-auto p-4 sm:p-8 flex flex-col lg:flex-row justify-between items-center gap-4 sm:gap-8 no-print">
        <div class="flex items-center gap-4 sm:gap-6 w-full lg:w-auto">
            <a href="dashboard.html" class="neu-card-sm neu-pressable w-11 h-11 sm:w-12 sm:h-12 flex items-center justify-center flex-shrink-0">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <div class="min-w-0">
                <span class="text-muted font-mono text-[8px] sm:text-[9px] tracking-[0.4em] uppercase block mb-1">Intelligence Fleet</span>
                <h1 class="text-3xl sm:text-4xl md:text-5xl font-epilogue font-black italic tracking-tighter uppercase leading-none">
                    STOCK <span class="text-orange-envolvia">ASSETS</span>
                </h1>
            </div>
        </div>

        <div class="flex flex-wrap justify-center gap-2 sm:gap-3 w-full lg:w-auto">
            <button onclick="descargarInventarioPDF()" id="btn-pdf" class="neu-card-sm neu-pressable px-4 sm:px-6 py-3 sm:py-4 text-[9px] sm:text-[10px] font-black uppercase tracking-widest flex items-center gap-2">
                <i class="fa-solid fa-file-pdf text-orange-envolvia"></i> <span class="hidden sm:inline">Generar Catálogo</span> PDF
            </button>
            <a href="registro.html" class="neu-accent neu-pressable rounded-[18px] px-6 sm:px-8 py-3 sm:py-4 text-[9px] sm:text-[10px] font-black uppercase tracking-widest">
                Nueva Unidad +
            </a>
        </div>
    </header>

    <section class="max-w-[1500px] mx-auto px-4 sm:px-8 mb-8 sm:mb-12 no-print">
        <div id="grid-filtros" class="grid grid-cols-1 lg:grid-cols-4 gap-3 sm:gap-6 items-center">
            <div class="lg:col-span-2 relative">
                <i class="fa-solid fa-magnifying-glass absolute left-6 top-1/2 -translate-y-1/2 text-muted"></i>
                <input type="text" id="main-search" oninput="filtrarTodo()" placeholder="BUSCAR MARCA O MODELO..."
                    class="neu-inset w-full py-4 sm:py-5 pl-16 pr-6 rounded-[24px] text-[11px] font-bold uppercase outline-none">
            </div>
            <div class="neu-card p-4 flex items-center justify-between px-6 sm:px-8">
                <div><p class="text-[8px] font-black text-muted uppercase">Disponibles</p><p class="text-xl sm:text-2xl font-epilogue font-black italic" id="count-total">0</p></div>
                <div class="neu-icon-plate w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-car-side text-[#FF8801]"></i></div>
            </div>
            <div class="neu-card p-4 flex items-center justify-between px-6 sm:px-8" id="kpi-valor-stock">
                <div><p class="text-[8px] font-black text-muted uppercase">Valor Stock</p><p class="text-xl sm:text-2xl font-epilogue font-black italic text-orange-envolvia" id="val-total">$0</p></div>
                <div class="neu-icon-plate w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-chart-line text-[#FF8801]"></i></div>
            </div>
        </div>
    </section>

    <main id="grid-principal" class="max-w-[1500px] mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-10 px-4 sm:px-8 no-print">
        <div class="col-span-full py-20 text-center font-bold text-muted text-xs tracking-widest animate-pulse">Sincronizando Stock...</div>
    </main>

    <script>
        const _supabase = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
        const userRol = localStorage.getItem('operador_rol');
        let inventarioLocal = [];

        async function fetchInventario() {
            if (userRol !== 'admin' && document.getElementById('kpi-valor-stock')) {
                document.getElementById('kpi-valor-stock').remove();
                document.getElementById('grid-filtros').classList.replace('lg:grid-cols-4', 'lg:grid-cols-3');
            }

            try {
                const { data, error } = await _supabase.from('inventario').select('*').neq('estatus', 'Vendido').order('creado_el', { ascending: false });
                if (error) throw error;
                inventarioLocal = data;
                document.getElementById('count-total').innerText = data.length;

                if (userRol === 'admin') {
                    const valor = data.reduce((acc, curr) => acc + (curr.precio_venta || 0), 0);
                    document.getElementById('val-total').innerText = `$${(valor / 1000000).toFixed(1)}M`;
                }

                renderizarCards(data);
            } catch (err) { console.error(err); }
        }

        function renderizarCards(unidades) {
            const grid = document.getElementById('grid-principal');
            if (unidades.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-muted font-bold">No hay unidades disponibles.</div>';
                return;
            }

            grid.innerHTML = unidades.map(u => {
                const primeraFoto = u.fotos?.[0];
                const img = primeraFoto
                    ? (primeraFoto.startsWith('http') ? primeraFoto : _supabase.storage.from('autos').getPublicUrl(primeraFoto).data.publicUrl)
                    : 'https://placehold.co/800x600/eeeeee/999999?text=Sin+Foto';
                return `
                <div class="car-card neu-card overflow-hidden transition-all duration-500">
                    <div class="h-52 sm:h-64 overflow-hidden rounded-t-[26px]"><img src="${img}" class="w-full h-full object-cover"></div>
                    <div class="p-5 sm:p-8">
                        <h3 class="text-lg sm:text-xl font-black uppercase italic mb-3 sm:mb-4">${u.marca} ${u.modelo}</h3>
                        <p class="text-2xl sm:text-3xl font-epilogue font-black italic">$${(u.precio_venta || 0).toLocaleString('de-DE')}</p>
                        <div class="mt-5 sm:mt-6 flex justify-between items-center border-t border-black/5 pt-4">
                            <span class="text-[9px] sm:text-[10px] font-bold text-muted uppercase">${u.anio || 'N/A'} • ${u.kilometraje?.toLocaleString() || 0} KM</span>
                            <a href="detalle.html?id=${u.id}" class="neu-accent neu-pressable w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-arrow-right"></i></a>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function filtrarTodo() {
            const query = document.getElementById('main-search').value.toLowerCase();
            const filtrados = inventarioLocal.filter(u => u.marca.toLowerCase().includes(query) || u.modelo.toLowerCase().includes(query));
            renderizarCards(filtrados);
        }

        // ==============================================
        // MOTOR NATIVO DE PDF (jsPDF + AutoTable)
        // ==============================================
        async function descargarInventarioPDF() {
            const btn = document.getElementById('btn-pdf');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Compilando...`;
            btn.disabled = true;

            const imgHeader = document.getElementById('img-header');

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('landscape', 'pt', 'letter');

                // Mapear datos de Supabase para la tabla
                const tableData = inventarioLocal.map(u => [
                    `${(u.marca || '').toUpperCase()} ${(u.modelo || '').toUpperCase()}`,
                    u.anio || 'N/A',
                    (u.kilometraje || 0).toLocaleString(),
                    (u.transmision || 'S/D').toUpperCase(),
                    (u.color || '-').toUpperCase(),
                    `$${(u.precio_venta || 0).toLocaleString('de-DE')}`
                ]);

                doc.autoTable({
                    startY: 180, // Espacio para el encabezado
                    margin: { top: 180, bottom: 90, left: 40, right: 40 },

                    head: [['MARCA / MODELO', 'AÑO', 'KM', 'TRANSMISIÓN', 'COLOR', 'PRECIO']],
                    body: tableData,
                    theme: 'plain',
                    styles: { fontSize: 9, cellPadding: 14, fontStyle: 'bold', textColor: [20, 20, 20] },
                    headStyles: { fillColor: [0, 0, 0], textColor: [255, 255, 255], fontSize: 9, halign: 'center', letterSpacing: 1 },
                    columnStyles: {
                        0: { halign: 'left' },
                        1: { halign: 'center' },
                        2: { halign: 'center' },
                        3: { halign: 'center' },
                        4: { halign: 'center' },
                        5: { halign: 'right', textColor: [255, 136, 1] }
                    },
                    alternateRowStyles: { fillColor: [248, 248, 248] },

                    // --- MASTER PAGE ---
                    didDrawPage: function (data) {
                        const ancho = doc.internal.pageSize.width;
                        const alto = doc.internal.pageSize.height;

                        // 1. ENCABEZADO CON IMAGEN
                        if(imgHeader.complete && imgHeader.naturalHeight !== 0) {
                            doc.addImage(imgHeader, 'PNG', 40, 20, ancho - 80, 140);
                        }

                        // 2. PIE DE PÁGINA INTERACTIVO
                        const footerY = alto - 70;

                        // Caja gris de fondo
                        doc.setFillColor(249, 250, 251);
                        doc.roundedRect(40, footerY, ancho - 80, 45, 20, 20, 'F');

                        // --- BLOQUE IG ---
                        doc.setFillColor(0, 0, 0);
                        doc.circle(75, footerY + 22.5, 14, 'F');
                        doc.setTextColor(255, 255, 255);
                        doc.setFont('helvetica', 'bold');
                        doc.setFontSize(10);
                        doc.text('IG', 75, footerY + 26, { align: 'center' });
                        doc.setTextColor(150, 150, 150);
                        doc.setFontSize(7);
                        doc.text('CATÁLOGO DIGITAL', 98, footerY + 18);
                        doc.setTextColor(0, 0, 0);
                        doc.setFontSize(10);
                        doc.setFont('helvetica', 'bolditalic');
                        doc.text('@Multiamerica', 98, footerY + 31);
                        doc.link(60, footerY, 150, 45, { url: 'https://www.instagram.com/multiamericavehiculos/' });

                        // --- BLOQUE MAPA ---
                        const centerX = ancho / 2;
                        doc.setFillColor(0, 0, 0);
                        doc.circle(centerX - 65, footerY + 22.5, 14, 'F');
                        doc.setTextColor(255, 255, 255);
                        doc.setFont('helvetica', 'bold');
                        doc.text('MAP', centerX - 65, footerY + 26, { align: 'center' });
                        doc.setTextColor(150, 150, 150);
                        doc.setFontSize(7);
                        doc.text('VISITA EL SHOWROOM', centerX - 42, footerY + 18);
                        doc.setTextColor(0, 0, 0);
                        doc.setFontSize(10);
                        doc.setFont('helvetica', 'bolditalic');
                        doc.text('Caracas, Miranda', centerX - 42, footerY + 31);
                        doc.link(centerX - 80, footerY, 180, 45, { url: 'https://maps.app.goo.gl/HH9eSy6yAtrWpQan6enlaces' });

                        // --- BLOQUE WA ---
                        doc.setFillColor(255, 136, 1);
                        doc.circle(ancho - 165, footerY + 22.5, 14, 'F');
                        doc.setTextColor(255, 255, 255);
                        doc.setFont('helvetica', 'bold');
                        doc.text('WA', ancho - 165, footerY + 26, { align: 'center' });
                        doc.setTextColor(255, 136, 1);
                        doc.setFontSize(7);
                        doc.text('ATENCIÓN DIRECTA', ancho - 142, footerY + 18);
                        doc.setTextColor(0, 0, 0);
                        doc.setFontSize(10);
                        doc.setFont('helvetica', 'bolditalic');
                        doc.text('+58 414-2206487', ancho - 142, footerY + 31);
                        doc.link(ancho - 180, footerY, 140, 45, { url: 'https://api.whatsapp.com/send/?phone=584142206487&text&type=phone_number&app_absent=0' });

                        // --- CREDITOS ---
                        doc.setFontSize(6);
                        doc.setTextColor(180, 180, 180);
                        doc.setFont('helvetica', 'bold');
                        doc.text('© 2026 MULTIAMERICA - DOCUMENTO DE VENTA EXCLUSIVO', 40, alto - 12);
                        doc.setTextColor(100, 100, 100);
                        doc.text(`TOTAL UNIDADES: ${inventarioLocal.length}`, ancho - 40, alto - 12, { align: 'right' });
                    }
                });

                doc.save(`Catalogo_Multiamerica_${new Date().toISOString().split('T')[0]}.pdf`);

            } catch (error) {
                console.error(error);
                alert("Error al generar el Catálogo PDF.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchInventario);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
        }
    </script>
</body>
</html>
