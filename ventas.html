<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Ventas Realizadas | Multiamerica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@1,900&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet"/>

    <style>
        :root {
            --neu-bg: #e7e8ee;
            --neu-text: #35354a;
            --neu-text-muted: #8890a3;
            --neu-light: #ffffff;
            --neu-dark: #c3c5d1;
        }
        body { background-color: var(--neu-bg); font-family: 'Montserrat', sans-serif; color: var(--neu-text); }
        .text-muted { color: var(--neu-text-muted); }
        .neu-card { background: var(--neu-bg); border-radius: 30px; box-shadow: 8px 8px 16px var(--neu-dark), -8px -8px 16px var(--neu-light); }
        .neu-card-sm { background: var(--neu-bg); border-radius: 18px; box-shadow: 6px 6px 12px var(--neu-dark), -6px -6px 12px var(--neu-light); transition: all .2s; }
        .neu-pressable:active { box-shadow: inset 4px 4px 9px var(--neu-dark), inset -4px -4px 9px var(--neu-light); transform: scale(0.98); }

        .sold-card {
            background: var(--neu-bg);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 8px 8px 16px var(--neu-dark), -8px -8px 16px var(--neu-light);
            filter: grayscale(0.4);
            transition: all 0.4s ease;
        }
        .sold-card:hover { filter: grayscale(0); }

        .sold-badge {
            background: #ef4444; /* Rojo intenso para el contraste */
            color: white;
            font-family: 'Epilogue';
            font-weight: 900;
            font-style: italic;
            padding: 8px 20px;
            border-radius: 0 0 0 20px;
            text-transform: uppercase;
            font-size: 12px;
        }

        .price-sold {
            font-family: 'Epilogue';
            font-weight: 900;
            font-style: italic;
            text-decoration: line-through;
            color: var(--neu-text-muted);
        }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF8801">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Central">
</head>
<body class="p-3 sm:p-6 md:p-12">

    <header class="max-w-[1400px] mx-auto mb-8 sm:mb-16 flex flex-col md:flex-row justify-between items-start md:items-end gap-4 sm:gap-6">
        <div>
            <div class="flex items-center gap-2 mb-2">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse flex-shrink-0"></span>
                <span class="font-mono text-[9px] sm:text-[10px] tracking-widest text-muted uppercase">Historial de Cierres exitosos</span>
            </div>
            <h1 class="text-3xl sm:text-5xl md:text-7xl font-['Epilogue'] font-black uppercase italic tracking-tighter">
                UNIDADES <span class="text-green-500">VENDIDAS</span>
            </h1>
        </div>
        <div class="flex gap-4">
            <a href="inventario.html" class="neu-card-sm neu-pressable px-6 sm:px-8 py-3 sm:py-4 font-bold uppercase italic text-xs">
                Ir al Stock
            </a>
        </div>
    </header>

    <section class="max-w-[1400px] mx-auto mb-8 sm:mb-12 grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="neu-card p-6 sm:p-8">
            <p class="text-[10px] font-bold text-muted uppercase mb-2">Total Ventas</p>
            <h4 id="count-ventas" class="text-3xl sm:text-4xl font-['Epilogue'] font-black italic">0</h4>
        </div>
    </section>

    <main id="grid-ventas" class="max-w-[1400px] mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
        </main>
<script>
    // Igual que el resto de la app: sesión real via Supabase Auth,
    // no una clave hardcodeada en el JS del cliente.
    if (!localStorage.getItem('operador_email')) {
        window.location.href = 'index.html';
    }
</script>
    <script>
        const _supabase = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

        // Mapeador de imagen (igual al de inventario)
        function getImg(data) {
            if (!data || data.length === 0) return 'https://placehold.co/800x600?text=VENDIDO';
            let path = Array.isArray(data) ? data[0] : data;
            path = path.replace(/['"\[\]{}]/g, '').trim();
            if (path.startsWith('http')) return path;
            const { data: urlData } = _supabase.storage.from('autos').getPublicUrl(path);
            return urlData.publicUrl;
        }

        async function cargarVentas() {
            try {
                const { data, error } = await _supabase
                    .from('inventario')
                    .select('*')
                    .eq('estatus', 'Vendido') // FILTRO CLAVE
                    .order('creado_el', { ascending: false });

                if (error) throw error;

                document.getElementById('count-ventas').innerText = data.length;
                render(data);
            } catch (e) {
                console.error(e);
            }
        }

        function render(items) {
            const container = document.getElementById('grid-ventas');
            if (items.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center py-20 text-muted font-mono italic uppercase">No hay registros de ventas todavía.</p>`;
                return;
            }

            container.innerHTML = items.map(u => `
                <div class="sold-card group">
                    <div class="relative h-52 sm:h-64 bg-gray-100">
                        <img src="${getImg(u.fotos)}" class="w-full h-full object-cover">
                        <div class="absolute top-0 right-0">
                            <div class="sold-badge">Sold Out</div>
                        </div>
                    </div>
                    <div class="p-5 sm:p-8">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="text-xl sm:text-2xl font-black uppercase italic leading-none">${u.marca} <span class="text-muted font-normal">${u.modelo}</span></h3>
                            <span class="text-[10px] font-mono text-muted flex-shrink-0">${u.anio}</span>
                        </div>
                        <div class="flex justify-between items-end border-t border-black/5 pt-6">
                            <div>
                                <p class="text-[8px] font-bold text-muted uppercase mb-1">Precio de Cierre</p>
                                <p class="text-2xl sm:text-3xl font-['Epilogue'] font-black italic text-green-500">
                                    $${(u.precio_venta || 0).toLocaleString('es-ES')}
                                </p>
                            </div>
                            <div class="text-right">
                                <i class="fa-solid fa-circle-check text-green-500 text-2xl"></i>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        cargarVentas();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
        }
    </script>
</body>
</html>
