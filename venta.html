<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Cierre de Operación | Multiamerica</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@1,900&family=Montserrat:wght@400;700;800&family=Roboto+Mono&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --neu-bg: #e7e8ee;
            --neu-text: #35354a;
            --neu-text-muted: #8890a3;
            --neu-light: #ffffff;
            --neu-dark: #c3c5d1;
        }
        body { background-color: var(--neu-bg); color: var(--neu-text); font-family: 'Montserrat', sans-serif; }
        .text-muted { color: var(--neu-text-muted); }
        .glass-container { background: var(--neu-bg); box-shadow: 12px 12px 24px var(--neu-dark), -12px -12px 24px var(--neu-light); }
        .neu-inset { background: var(--neu-bg); box-shadow: inset 4px 4px 9px var(--neu-dark), inset -4px -4px 9px var(--neu-light); border-radius: 24px; }
        .neu-card-sm { background: var(--neu-bg); border-radius: 14px; box-shadow: 5px 5px 10px var(--neu-dark), -5px -5px 10px var(--neu-light); }

        input, select, textarea {
            background: var(--neu-bg) !important;
            box-shadow: inset 3px 3px 7px var(--neu-dark), inset -3px -3px 7px var(--neu-light);
            border: none !important;
            padding: 15px !important;
            color: var(--neu-text) !important;
            font-family: 'Roboto Mono';
            font-size: 14px;
            width: 100%;
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        /* ESCALADO DINÁMICO DEL PRECIO */
        #precio_final {
            padding-left: 55px !important; 
            font-size: 26px !important;    
        }
        @media (min-width: 768px) {
            #precio_final {
                padding-left: 70px !important; 
                font-size: 32px !important;    
            }
        }
        
        input:focus, select:focus, textarea:focus { outline: none; box-shadow: inset 3px 3px 7px var(--neu-dark), inset -3px -3px 7px var(--neu-light), 0 0 0 3px rgba(255, 136, 1, 0.25); }
        label { font-size: 10px; color: var(--neu-text-muted); text-transform: uppercase; letter-spacing: 0.15em; font-weight: 800; margin-bottom: 8px; display: block; margin-left: 4px; }

        /* Corregido el error del padding */
        .receipt-card { background: #fff7ed; border: 2px dashed #ffedd5; padding: 20px; border-radius: 20px; }
        @media (min-width: 768px) { .receipt-card { padding: 24px; } }

        .btn-finalize { background: #0f172a; color: white; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .btn-finalize:hover { background: #FF8801; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 136, 1, 0.2); }

        .file-upload { border-radius: 16px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s; background: var(--neu-bg); box-shadow: inset 3px 3px 7px var(--neu-dark), inset -3px -3px 7px var(--neu-light); }
        .file-upload:hover { box-shadow: inset 3px 3px 7px var(--neu-dark), inset -3px -3px 7px var(--neu-light), 0 0 0 2px rgba(255,136,1,0.3); }
        
        .upload-panel { transition: max-height 0.4s ease-out, opacity 0.4s ease-out; overflow: hidden; max-height: 0; opacity: 0; }
        .upload-panel.open { max-height: 500px; opacity: 1; }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF8801">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Central">
</head>

<body class="min-h-screen p-3 sm:p-4 md:p-8 flex items-start md:items-center justify-center">

    <main class="max-w-4xl w-full glass-container p-6 sm:p-8 md:p-14 relative overflow-hidden rounded-3xl md:rounded-[40px]">
        <div class="absolute top-0 right-0 w-24 h-24 md:w-32 md:h-32 bg-orange-50 rounded-bl-full -z-10 opacity-50"></div>

        <header class="mb-8 md:mb-12 border-b border-black/5 pb-6 md:pb-8">
            <div class="flex flex-col md:flex-row md:justify-between items-start gap-4 md:gap-0">
                <div>
                    <span class="text-[#FF8801] text-[9px] md:text-[10px] font-black uppercase tracking-[0.3em] mb-2 block">Protocolo de Cierre</span>
                    <h1 class="text-3xl md:text-5xl font-['Epilogue'] font-black uppercase italic leading-none">
                        FINALIZAR <span class="text-[#FF8801]">VENTA</span>
                    </h1>
                </div>
                <div class="neu-card-sm p-3 md:p-4 w-full md:w-auto text-left md:text-right">
                    <p class="text-[8px] font-bold text-muted uppercase">Ref. Interna</p>
                    <p id="ref-id" class="text-xs font-mono font-bold">#--------</p>
                </div>
            </div>
            <p id="unidad-info" class="text-xs md:text-sm font-bold text-muted mt-4 md:mt-6 flex items-center gap-2">
                <i class="fa-solid fa-car-side text-[#FF8801]"></i> Cargando especificaciones...
            </p>
        </header>

        <form id="venta-form" class="space-y-6 md:space-y-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-8 neu-inset p-4 md:p-6">
                <div class="space-y-2">
                    <label>Precio Final Acordado ($)</label>
                    <div class="relative group flex items-center">
                        <span class="absolute left-4 md:left-6 font-black text-muted text-xl md:text-2xl z-20 pointer-events-none group-focus-within:text-[#FF8801] transition-colors">$</span>
                        <input type="number" id="precio_final" required placeholder="0.00"
                               class="font-black w-full rounded-xl md:rounded-2xl outline-none transition-all relative">
                    </div>
                </div>
                <div>
                    <label>Canal de Pago</label>
                    <select id="metodo_pago" class="font-bold h-full min-h-[50px] md:min-h-[60px]">
                        <option value="EFECTIVO">EFECTIVO (DIVISAS)</option>
                        <option value="ZELLE">ZELLE / USA</option>
                        <option value="BINANCE">CRYPTOS (USDT)</option>
                        <option value="TRANSFERENCIA">TRANSFERENCIA NACIONAL</option>
                        <option value="MIXTO">PAGO COMBINADO</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                <div>
                    <label>Nombre del Propietario</label>
                    <input type="text" id="comprador" placeholder="NOMBRE COMPLETO" required class="uppercase font-bold">
                </div>
                <div>
                    <label>Identificación (V/J)</label>
                    <input type="text" id="cedula" placeholder="DNI / RIF" class="font-bold">
                </div>
                <div>
                    <label>WhatsApp de Contacto</label>
                    <input type="tel" id="telefono" placeholder="04XXXXXXXXX" required class="font-bold" oninput="buscarLeadCoincidente()">
                    <p id="lead-match-badge" class="hidden mt-2 text-[10px] font-black uppercase text-green-600 flex items-center gap-1.5"></p>
                </div>
            </div>

            <div class="space-y-4 md:space-y-6">
                <div>
                    <label>Notas Técnicas del Cierre</label>
                    <textarea id="notas" rows="3" placeholder="Detalles de la entrega..." class="font-medium"></textarea>
                </div>

                <div class="border-t border-black/5 pt-4">
                    <button type="button" onclick="toggleUpload()" class="flex items-center gap-2 text-muted hover:text-[#FF8801] transition-colors font-bold text-xs uppercase tracking-widest outline-none">
                        <i id="upload-icon" class="fa-solid fa-chevron-down transition-transform"></i>
                        Adjuntar Comprobante de Pago
                    </button>

                    <div id="upload-panel" class="upload-panel mt-4">
                        <div class="file-upload" onclick="document.getElementById('comprobante_file').click()">
                            <input type="file" id="comprobante_file" accept="image/*" class="hidden" onchange="previewImage(this)">
                            <div id="preview-box">
                                <i class="fa-solid fa-cloud-arrow-up text-3xl text-muted mb-2 block"></i>
                                <p class="text-[9px] font-bold text-muted uppercase tracking-widest">Toca para subir foto</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="receipt-card">
                <div class="flex items-start gap-3">
                    <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center shadow-sm text-base flex-shrink-0 text-orange-500">📍</div>
                    <div>
                        <p class="text-[9px] font-black text-orange-800 uppercase tracking-widest mb-1">Entrega Autorizada</p>
                        <p class="text-[10px] text-orange-700/70 font-medium leading-relaxed uppercase">Chevrolet Quinta Crespo • Sincronice con patio.</p>
                    </div>
                </div>
            </div>

            <div class="pt-4 border-t border-black/5">
                <button type="submit" id="btn-submit" class="btn-finalize w-full py-5 rounded-2xl font-['Epilogue'] font-black uppercase italic text-lg flex items-center justify-center gap-3">
                    <span>REGISTRAR CIERRE</span>
                    <i class="fa-solid fa-arrow-right-long text-sm"></i>
                </button>
                <a href="inventario.html" class="block text-center text-[10px] font-bold text-muted uppercase tracking-[0.3em] mt-6 hover:text-red-500 transition-colors">
                    <i class="fa-solid fa-xmark mr-2"></i> Cancelar
                </a>
            </div>
        </form>
    </main>

    <script>
        const _supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
        const urlParams = new URLSearchParams(window.location.search);
        const idUnidad = urlParams.get('id');
        const operadorEmail = localStorage.getItem('operador_email');

        function toggleUpload() {
            const panel = document.getElementById('upload-panel');
            const icon = document.getElementById('upload-icon');
            panel.classList.toggle('open');
            icon.classList.toggle('fa-chevron-up');
            icon.classList.toggle('fa-chevron-down');
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview-box').innerHTML = `
                        <div class="relative inline-block">
                            <img src="${e.target.result}" class="h-32 object-cover rounded-xl border-4 border-[#FF8801] shadow-lg">
                            <span class="absolute -top-3 -right-3 bg-green-500 text-white w-8 h-8 flex items-center justify-center rounded-full text-sm border-2 border-white shadow-md"><i class="fa-solid fa-check"></i></span>
                        </div>
                    `;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        let debounceLeadMatch = null;
        function buscarLeadCoincidente() {
            clearTimeout(debounceLeadMatch);
            const badge = document.getElementById('lead-match-badge');
            const telefono = document.getElementById('telefono').value.trim();
            if (telefono.length < 7) { badge.classList.add('hidden'); return; }

            debounceLeadMatch = setTimeout(async () => {
                const cola = telefono.replace(/\D/g, '').slice(-8);
                if (cola.length < 8) { badge.classList.add('hidden'); return; }

                const { data, error } = await _supabaseClient
                    .from('consultas_showroom')
                    .select('cliente_nombre, cliente_telefono, vehiculos, creado_el')
                    .not('cliente_telefono', 'is', null)
                    .order('creado_el', { ascending: false })
                    .limit(50);

                if (error || !data) { badge.classList.add('hidden'); return; }

                const match = data.find(l => (l.cliente_telefono || '').replace(/\D/g, '').slice(-8) === cola);
                if (match) {
                    const autos = (match.vehiculos || []).join(', ') || 'su selección';
                    badge.innerHTML = `<i class="fa-solid fa-link"></i> Vinculado a Lead Web: ${match.cliente_nombre || 'Cliente'} — ${autos}`;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            }, 400);
        }

        async function init() {
            if(!idUnidad) { window.location.href = 'inventario.html'; return; }
            const { data: unidad, error } = await _supabaseClient.from('inventario').select('*').eq('id', idUnidad).single();
            if (error || !unidad) { window.location.href = 'inventario.html'; return; }

            window.unidadData = unidad; 
            document.getElementById('ref-id').innerText = `#${unidad.id.substring(0,8).toUpperCase()}`;
            document.getElementById('unidad-info').innerHTML = `<i class="fa-solid fa-car-side text-[#FF8801]"></i> ${unidad.marca} ${unidad.modelo} • ${unidad.anio}`;
            document.getElementById('precio_final').value = unidad.precio_venta;
        }

        document.getElementById('venta-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const fileInput = document.getElementById('comprobante_file');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> PROCESANDO...`;

            let comprobanteUrl = null;
            try {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileName = `comprobantes/${Date.now()}_${idUnidad}.png`;
                    const { data: uploadData, error: uploadError } = await _supabaseClient.storage.from('autos').upload(fileName, file);
                    if (uploadError) throw uploadError;
                    comprobanteUrl = uploadData.path;
                }

                const u = window.unidadData;
                const payloadVenta = {
                    vehiculo: `${u.marca} ${u.modelo}`,
                    vehiculo_id_original: idUnidad,
                    vendedor: operadorEmail, 
                    precio_venta: parseFloat(document.getElementById('precio_final').value),
                    costo_compra: u.costo_adquisicion || u.costo_compra || 0,
                    precio_lista: u.precio_venta || 0,
                    marca: u.marca,
                    modelo: u.modelo,
                    anio: u.anio,
                    vin: u.vin,
                    comprador: document.getElementById('comprador').value.toUpperCase(),
                    cedula_comprador: document.getElementById('cedula').value,
                    telefono_comprador: document.getElementById('telefono').value,
                    metodo_pago: document.getElementById('metodo_pago').value,
                    notas: document.getElementById('notas').value,
                    vendido_por: operadorEmail, 
                    gerente_id: u.creado_por,
                    comision_pagada: false,
                    comprobante_url: comprobanteUrl,
                    fecha_cierre: new Date().toISOString()
                };

                const { error: insErr } = await _supabaseClient.from('ventas').insert([payloadVenta]);
                if (insErr) throw insErr;

                const { error: delErr } = await _supabaseClient.from('inventario').delete().eq('id', idUnidad);
                if (delErr) throw delErr;

                alert("CIERRE EXITOSO");
                window.location.href = 'dashboard.html';
            } catch (err) {
                alert("ERROR: " + err.message);
                btn.disabled = false;
                btn.innerHTML = `<span>REGISTRAR CIERRE</span><i class="fa-solid fa-arrow-right-long text-sm"></i>`;
            }
        };

        init();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
        }
    </script>
</body>
</html>
