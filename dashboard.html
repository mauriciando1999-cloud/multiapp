<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CENTRAL | Multiamerica</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Montserrat:ital,wght@1,900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="config.js"></script>

    <style>
        body { background-color: #f8f9fa; color: #0a0a0a; font-family: 'Inter', sans-serif; }
        .font-title { font-family: 'Montserrat', sans-serif; font-weight: 900; font-style: italic; letter-spacing: -0.04em; }
        .bg-grid { background-image: radial-gradient(circle, #e5e7eb 1px, transparent 1px); background-size: 24px 24px; }
        .bento-card { background: #ffffff; border: 1px solid #f3f4f6; border-radius: 32px; box-shadow: 0 10px 40px -10px rgba(0,0,0,0.04); transition: all 0.3s ease; }
        .live-pulse { width: 8px; height: 8px; background: #FF8801; border-radius: 50%; animation: pulse 2s infinite; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 136, 1, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(255, 136, 1, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 136, 1, 0); } }
        
        /* Ajustes estructurales de FullCalendar */
        .fc .fc-toolbar-title { font-size: 1.1rem !important; font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900; text-transform: uppercase;}
        .fc .fc-button-primary { background-color: #000 !important; border: none !important; border-radius: 10px !important; text-transform: uppercase; font-size: 10px !important; font-weight: bold;}
        .fc-theme-standard th { border-color: #f3f4f6; padding: 8px 0; font-size: 10px; text-transform: uppercase; color: #999;}
        .fc-theme-standard td { border-color: #f3f4f6; }
    </style>
</head>
<body class="bg-grid min-h-screen pb-12">

    <main class="max-w-[1400px] mx-auto p-4 md:p-8">
        <header class="flex flex-col md:flex-row justify-between md:items-end gap-6 mb-10 mt-4 md:mt-0">
            <div>
                <div class="flex items-center gap-2 text-[#FF8801] text-[10px] font-black uppercase mb-3">
                    <div class="live-pulse"></div> <span id="status-tag">Core System Online</span>
                </div>
                <h1 id="titulo-central" class="text-6xl md:text-8xl font-title uppercase leading-[0.85] tracking-tight">CENTRAL.</h1>
            </div>
            <div class="flex items-center gap-4 bg-white p-3 pr-4 rounded-full shadow-sm border border-gray-100 w-fit">
                <div class="w-10 h-10 bg-black rounded-full flex items-center justify-center font-title italic text-white text-lg" id="user-initial">?</div>
                <div class="text-left">
                    <p id="user-email" class="text-[11px] font-mono font-bold text-gray-800 uppercase tracking-tight">---</p>
                    <button onclick="logout()" class="text-[9px] font-black text-red-500 uppercase hover:text-[#FF8801] transition-colors">Cerrar Sesión</button>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div id="panel-operativo" class="lg:col-span-8 space-y-6 flex flex-col">
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="bento-card p-6 flex flex-col justify-between">
                        <span class="text-[9px] font-black text-gray-400 uppercase">Stock Global</span>
                        <span class="text-4xl font-title italic mt-2" id="kpi-v">0</span>
                    </div>
                    <div class="bento-card p-6 flex flex-col justify-between border-l-4 border-[#FF8801]">
                        <span class="text-[9px] font-black text-[#FF8801] uppercase">Mis Gestiones</span>
                        <span class="text-4xl font-title italic mt-2" id="kpi-c">0</span>
                    </div>
                    <div class="bento-card p-6 bg-black text-white flex flex-col justify-between md:col-span-2">
                        <span class="text-[9px] font-black text-gray-500 uppercase">Credencial Activa</span>
                        <span id="rol-tag" class="text-xs font-title italic text-[#FF8801] mt-2 uppercase">---</span>
                    </div>
                </div>

                <div id="seccion-admin" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bento-card p-6 flex flex-col h-[350px]">
                        <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-2">
                            <h2 class="text-xl font-title italic uppercase">Revisiones</h2>
                            <span class="text-[9px] font-black uppercase text-gray-400">Consignaciones</span>
                        </div>
                        <div id="lista-solicitudes" class="space-y-3 overflow-y-auto flex-1 pr-2">
                            <p class="text-xs text-gray-400 font-mono animate-pulse">Sincronizando...</p>
                        </div>
                    </div>
                    
                    <div class="bento-card p-6 flex flex-col h-[350px] relative group">
                        <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-2">
                            <h2 class="text-xl font-title italic uppercase text-blue-600">Talento IA</h2>
                            <a href="admin_postulantes.html" class="text-[9px] font-black uppercase text-blue-500 hover:text-[#FF8801] transition-colors flex items-center gap-1">
                                Ver Todos <i class="fa-solid fa-arrow-right"></i>
                            </a>
                        </div>
                        <div id="lista-postulantes" class="space-y-3 overflow-y-auto flex-1 pr-2">
                            <p class="text-xs text-gray-400 font-mono animate-pulse">Sincronizando...</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <a href="inventario.html" class="bento-card p-6 group flex flex-col items-center justify-center text-center hover:border-[#FF8801]">
                        <div class="w-12 h-1 bg-black mb-4 group-hover:bg-[#FF8801] transition-colors"></div>
                        <h3 class="text-sm font-title uppercase italic">Inventario</h3>
                    </a>
                    <a href="registro.html" class="bento-card p-6 bg-black text-white group flex flex-col items-center justify-center text-center transform hover:scale-105 transition-transform">
                        <div class="w-12 h-1 bg-[#FF8801] mb-4"></div>
                        <h3 class="text-sm font-title uppercase italic">Registrar</h3>
                    </a>
                    <a href="vendedores.html" class="bento-card p-6 group flex flex-col items-center justify-center text-center hover:border-black">
                        <div class="w-12 h-1 bg-gray-200 mb-4 group-hover:bg-black transition-colors"></div>
                        <h3 class="text-sm font-title uppercase italic">Mi Equipo</h3>
                    </a>
                </div>

                <a href="analisis_ventas.html" id="btn-analisis" class="bento-card p-6 border-2 border-transparent hover:border-[#FF8801] bg-orange-50/30 flex justify-between items-center transition-all cursor-pointer">
                    <h3 class="text-xs font-title uppercase italic text-[#FF8801]">Inteligencia Global de Negocios</h3>
                    <span class="text-orange-600 font-bold text-xs">ACCESO PRO →</span>
                </a>
            </div>

            <div id="columna-agenda" class="lg:col-span-4 flex flex-col">
                <div class="bento-card p-6 flex-1 bg-white min-h-[500px]">
                    <h2 class="text-xl font-title italic uppercase mb-4 text-center border-b border-gray-100 pb-2">Agenda</h2>
                    <div id="calendar" class="w-full"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const _supabase = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
        const uEmail = localStorage.getItem('operador_email');
        const uRol = localStorage.getItem('operador_rol');
        const uSlug = localStorage.getItem('vendedor_slug');

        async function init() {
            if (!uEmail) { window.location.href = 'index.html'; return; }
            
            document.getElementById('user-email').innerText = uEmail;
            document.getElementById('user-initial').innerText = uEmail[0].toUpperCase();
            document.getElementById('rol-tag').innerText = uRol === 'admin' ? 'SYSTEM ADMINISTRATOR' : `GERENTE DE EQUIPO`;

            cargarMetricas();

            if (uRol === 'gerente') {
                document.getElementById('seccion-admin')?.remove();
                document.getElementById('columna-agenda')?.remove();
                document.getElementById('btn-analisis')?.remove();
                document.getElementById('panel-operativo').classList.replace('lg:col-span-8', 'lg:col-span-12');
                document.getElementById('titulo-central').innerText = 'GESTIÓN.';
                document.getElementById('status-tag').innerText = 'Panel Privado';
            } else {
                await cargarRevisiones();
                await cargarTalentos();
                initCalendar();
            }
        }

        async function cargarMetricas() {
            try {
                const { count: v } = await _supabase.from('inventario').select('*', { count: 'exact', head: true }).neq('estatus', 'Vendido');
                document.getElementById('kpi-v').innerText = v || 0;

                let q = _supabase.from('consignaciones').select('*', { count: 'exact', head: true }).eq('estatus', 'Aprobado');
                if (uRol === 'gerente') q = q.eq('vendedor_slug', uSlug);
                
                const { count: c } = await q;
                document.getElementById('kpi-c').innerText = c || 0;
            } catch (e) { console.error("KPI Error:", e); }
        }

        async function cargarRevisiones() {
            const container = document.getElementById('lista-solicitudes');
            try {
                // TRAEMOS TODO SIN FILTRAR ESTATUS PARA DIAGNOSTICAR
                const { data, error } = await _supabase
                    .from('consignaciones')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(10);
                
                if (error) throw error;

                console.log("Dato crudo de consignaciones:", data); // Abre F12 para ver esto

                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="text-xs text-gray-400 font-bold mt-10 text-center uppercase">Bandeja Vacía en BD</p>';
                    return;
                }

                container.innerHTML = data.map(c => `
                    <div class="p-4 border border-gray-100 rounded-3xl flex justify-between items-center bg-gray-50/30 hover:bg-white transition-all">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-black rounded-2xl flex items-center justify-center text-[#FF8801] font-bold text-xs"><i class="fa-solid fa-car"></i></div>
                            <div>
                                <p class="text-[11px] font-black uppercase leading-tight">${c.vehiculo || 'SIN VEHÍCULO'}</p>
                                <p class="text-[9px] text-gray-400 font-bold mt-1">PROP: ${c.nombre || 'S/N'} | ESTATUS: <span class="text-red-500">${c.estatus || 'VACÍO/NULO'}</span></p>
                            </div>
                        </div>
                        <a href="revision_detalle.html?id=${c.id}" class="text-[9px] bg-black text-white px-4 py-2 rounded-xl font-black uppercase hover:bg-[#FF8801] transition-colors">Auditar</a>
                    </div>
                `).join('');
            } catch (e) {
                console.error("Error BD Revisiones:", e);
                container.innerHTML = `<p class="text-[10px] text-red-500">Error: ${e.message}</p>`;
            }
        }

        async function cargarTalentos() {
            const container = document.getElementById('lista-postulantes');
            try {
                const { data, error } = await _supabase
                    .from('postulantes')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(4);
                
                if (error) throw error;
                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="text-xs text-gray-400 font-bold mt-10 text-center uppercase tracking-widest">Bandeja Vacía</p>';
                    return;
                }

                container.innerHTML = data.map(p => `
                    <div onclick="window.location.href='admin_postulantes.html'" class="p-3 border border-gray-100 rounded-3xl flex justify-between items-center bg-blue-50/20 hover:bg-white cursor-pointer transition-all group">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-blue-600 rounded-xl flex items-center justify-center text-white text-[10px] font-bold">
                                ${p.nombre[0]}${p.apellido[0]}
                            </div>
                            <div>
                                <p class="text-[10px] font-black uppercase">${p.nombre} ${p.apellido}</p>
                                <p class="text-[8px] text-blue-500 font-black mt-0.5">VER EXPEDIENTE</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-gray-300 group-hover:text-blue-600 transition-colors"></i>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = `<p class="text-[10px] text-red-500 p-4">Fallo BD: ${e.message}</p>`;
            }
        }

        async function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            if (!calendarEl || typeof FullCalendar === 'undefined') return;

            let eventos = [];
            try {
                const { data, error } = await _supabase.from('calendario_entrevistas').select('*');
                if (!error && data) {
                    eventos = data.map(cita => ({
                        id: cita.id,
                        title: `${cita.prospecto_nombre} (${cita.tipo_entrevista || 'Entrevista'})`, 
                        start: cita.fecha_hora,
                        backgroundColor: '#000000',
                        borderColor: '#FF8801',
                        textColor: '#ffffff'
                    }));
                }
            } catch(e) { console.error("Error extrayendo agenda", e); }

            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: window.innerWidth < 768 ? 'listWeek' : 'dayGridMonth',
                contentHeight: 'auto',
                locale: 'es',
                headerToolbar: { left: 'prev,next', center: 'title', right: 'today' },
                buttonText: { today: 'Hoy' },
                events: eventos
            });
            
            calendar.render();
            // Corrección de tamaño para contenedores Flex de Tailwind
            setTimeout(() => calendar.updateSize(), 300);
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
