<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Equipo de Ventas | Multiamerica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Montserrat:ital,wght@1,900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { background-color: #f8f9fa; color: #0a0a0a; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .font-title { font-family: 'Montserrat', sans-serif; font-weight: 900; font-style: italic; letter-spacing: -0.04em; }
        .bg-grid { background-image: radial-gradient(circle, #e5e7eb 1px, transparent 1px); background-size: 24px 24px; }
        .bento-card { background: #ffffff; border: 1px solid #f3f4f6; border-radius: 24px; box-shadow: 0 10px 40px -10px rgba(0,0,0,0.04); transition: all 0.3s ease; }
        .accordion-header { cursor: pointer; user-select: none; }
        .accordion-content { transition: max-height 0.3s ease-out; overflow: hidden; max-height: 2000px; }
        .accordion-content.collapsed { max-height: 0; }
        .chevron { transition: transform 0.3s ease; }
        .chevron.collapsed { transform: rotate(-90deg); }
        .modal-enter { animation: modalIn 0.3s ease-out forwards; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    </style>
</head>
<body class="bg-grid min-h-screen pb-12">

    <main class="max-w-[1000px] mx-auto p-4 md:p-8">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
            <div>
                <a href="dashboard.html" class="inline-flex items-center gap-2 text-gray-400 hover:text-orange-600 font-black uppercase text-[10px] tracking-widest mb-2 transition-colors">
                    ← Volver a Central
                </a>
                <h1 class="text-6xl md:text-8xl font-title uppercase leading-[0.85] tracking-tight text-[#FF8801]">VENTAS.</h1>
            </div>
            <div class="w-full md:w-auto">
                <input type="text" id="buscador" placeholder="Buscar asesor o equipo..." 
                    class="w-full md:w-72 bg-white border border-gray-200 text-xs p-4 rounded-full outline-none focus:border-[#FF8801] transition-all shadow-sm font-bold uppercase"
                    onkeyup="filtrarVendedores()">
            </div>
        </header>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
            <div class="bento-card p-6 flex flex-col justify-between">
                <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Total Asesores</span>
                <span class="text-4xl font-title italic mt-2 text-black" id="kpi-asesores">0</span>
            </div>
            <div class="bento-card p-6 flex flex-col justify-between border-l-4 border-[#FF8801]">
                <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Equipos Activos</span>
                <span class="text-4xl font-title italic mt-2 text-[#FF8801]" id="kpi-equipos">0</span>
            </div>
        </div>

        <div id="contenedor-equipos" class="space-y-6">
            <div class="text-center py-10 text-gray-400 font-bold uppercase text-xs italic">Sincronizando estructura de mando...</div>
        </div>
    </main>

    <div id="modal-reasignar" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="bg-white w-full max-w-sm rounded-[32px] p-8 modal-enter shadow-2xl border border-[#FF8801]">
            <h3 class="text-2xl font-title italic uppercase text-[#FF8801] mb-1">Mover Asesor</h3>
            <p class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-6 italic" id="reasignar-nombre-asesor">--</p>
            
            <div class="space-y-4 text-left mb-8">
                <div>
                    <label class="text-[9px] font-black uppercase text-gray-500 mb-2 block ml-2">Seleccionar Nuevo Gerente</label>
                    <select id="select-gerente" class="w-full bg-orange-50 border border-orange-100 text-xs font-bold uppercase p-4 rounded-2xl outline-none focus:border-[#FF8801] focus:bg-white transition-all cursor-pointer">
                        </select>
                </div>
            </div>

            <input type="hidden" id="hidden-asesor-slug">

            <div class="grid grid-cols-2 gap-3 w-full mt-4">
                <button onclick="cerrarModal('modal-reasignar')" class="bg-gray-100 text-gray-500 p-4 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-gray-200 transition-all">Cancelar</button>
                <button onclick="guardarReasignacion()" class="bg-[#FF8801] text-white p-4 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:shadow-lg hover:shadow-orange-200 transition-all">Confirmar Cambio</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const _supabase = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
        const userRol = localStorage.getItem('operador_rol');
        let todosLosVendedores = [];

        async function initApp() {
            if (!localStorage.getItem('operador_email')) { window.location.href = 'index.html'; return; }
            await cargarVendedores();
        }

        async function cargarVendedores() {
            const { data, error } = await _supabase.from('vendedores').select('*').order('nombre', { ascending: true });
            if (error) return console.error("Error:", error);
            
            todosLosVendedores = data || [];
            actualizarKPIs();
            renderizarEquipos(todosLosVendedores);
        }

        function actualizarKPIs() {
            document.getElementById('kpi-asesores').innerText = todosLosVendedores.length;
            const gerenciasUnicas = new Set(todosLosVendedores.map(v => v.gerente_id).filter(id => id));
            const tieneDirectos = todosLosVendedores.some(v => !v.gerente_id);
            document.getElementById('kpi-equipos').innerText = gerenciasUnicas.size + (tieneDirectos ? 1 : 0);
        }

        function renderizarEquipos(listaFiltrada) {
            const contenedor = document.getElementById('contenedor-equipos');
            contenedor.innerHTML = '';

            if(listaFiltrada.length === 0) {
                contenedor.innerHTML = `<div class="text-center py-10 text-gray-300 font-bold uppercase text-xs">Sin registros</div>`;
                return;
            }

            // Agrupación por Gerente (usando su slug como llave)
            const equipos = { 'directos': { nombreGerente: 'VENDEDORES DIRECTOS / GERENCIA GENERAL', miembros: [] } };

            listaFiltrada.forEach(v => {
                if (!v.gerente_id) {
                    equipos['directos'].miembros.push(v);
                } else {
                    if (!equipos[v.gerente_id]) {
                        const gerenteObj = todosLosVendedores.find(g => g.slug === v.gerente_id);
                        const nombreG = gerenteObj ? `${gerenteObj.nombre} ${gerenteObj.apellido || ''}` : 'Gerencia Externa';
                        equipos[v.gerente_id] = { nombreGerente: `EQUIPO: ${nombreG.toUpperCase()}`, miembros: [] };
                    }
                    equipos[v.gerente_id].miembros.push(v);
                }
            });

            for (const [idEquipo, equipo] of Object.entries(equipos)) {
                if (equipo.miembros.length === 0) continue;

                const isAdmin = userRol === 'admin';
                const accentColor = idEquipo === 'directos' ? 'border-gray-200' : 'border-[#FF8801]';
                
                let htmlEquipo = `
                <div class="mb-4">
                    <div class="bg-white border-l-4 ${accentColor} rounded-r-2xl p-5 flex items-center justify-between shadow-sm accordion-header hover:bg-orange-50/20 transition-colors" onclick="toggleAccordion('acc-${idEquipo}', 'chev-${idEquipo}')">
                        <div>
                            <h2 class="text-lg md:text-xl font-title italic uppercase tracking-tighter text-black">${equipo.nombreGerente}</h2>
                            <p class="text-[9px] font-black text-gray-400 uppercase tracking-widest mt-1">${equipo.miembros.length} Asesores bajo mando</p>
                        </div>
                        <svg id="chev-${idEquipo}" class="w-5 h-5 text-gray-400 chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                    <div id="acc-${idEquipo}" class="accordion-content mt-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                `;

                equipo.miembros.forEach(asesor => {
                    const statusColor = asesor.activo ? 'bg-green-400' : 'bg-red-400';
                    const isGerente = asesor.rol === 'gerente';
                    const btnAdmin = isAdmin 
                        ? `<button onclick="abrirModalReasignacion('${asesor.slug}', '${asesor.nombre} ${asesor.apellido || ''}', '${asesor.gerente_id || ''}')" class="text-[9px] font-black text-[#FF8801] uppercase hover:tracking-widest transition-all mt-4">⟲ Mover de Equipo</button>` 
                        : '';

                    htmlEquipo += `
                        <div class="bento-card p-5 border-t-4 ${isGerente ? 'border-black' : 'border-transparent'}">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <h3 class="font-black text-xs uppercase truncate">${asesor.nombre} ${asesor.apellido || ''}</h3>
                                        ${isGerente ? '<span class="bg-black text-white text-[7px] px-2 py-0.5 rounded-full font-black uppercase">Gerente</span>' : ''}
                                    </div>
                                    <p class="text-[8px] font-mono font-bold text-gray-400 uppercase tracking-widest mt-1">ID: ${asesor.slug}</p>
                                </div>
                                <div class="w-2.5 h-2.5 rounded-full ${statusColor} shadow-sm"></div>
                            </div>
                            <div class="space-y-2">
                                <div class="bg-gray-50 rounded-xl p-3 flex justify-between items-center border border-gray-100">
                                    <span class="text-[8px] font-black text-gray-400 uppercase tracking-widest">WhatsApp</span>
                                    <span class="text-[10px] font-mono font-bold">${asesor.whatsapp || '---'}</span>
                                </div>
                            </div>
                            ${btnAdmin}
                        </div>`;
                });

                htmlEquipo += `</div></div>`;
                contenedor.innerHTML += htmlEquipo;
            }
        }

        function toggleAccordion(contentId, chevronId) {
            document.getElementById(contentId).classList.toggle('collapsed');
            document.getElementById(chevronId).classList.toggle('collapsed');
        }

        function filtrarVendedores() {
            const texto = document.getElementById('buscador').value.toLowerCase();
            const filtrados = todosLosVendedores.filter(v => 
                `${v.nombre} ${v.apellido || ''}`.toLowerCase().includes(texto) || 
                v.slug.toLowerCase().includes(texto)
            );
            renderizarEquipos(filtrados);
        }

        function abrirModalReasignacion(asesorSlug, asesorNombre, gerenteActualId) {
            document.getElementById('reasignar-nombre-asesor').innerText = `MODIFICANDO A: ${asesorNombre}`;
            document.getElementById('hidden-asesor-slug').value = asesorSlug;

            const select = document.getElementById('select-gerente');
            select.innerHTML = `<option value="null">-- VENTA DIRECTA (GERENCIA GENERAL) --</option>`;

            // Solo mostramos como opciones a quienes tienen rol 'gerente' en la DB
            todosLosVendedores.filter(v => v.rol === 'gerente').forEach(v => {
                if (v.slug !== asesorSlug) {
                    const isSelected = (v.slug === gerenteActualId) ? 'selected' : '';
                    select.innerHTML += `<option value="${v.slug}" ${isSelected}>${v.nombre} ${v.apellido || ''}</option>`;
                }
            });

            document.getElementById('modal-reasignar').classList.remove('hidden');
        }

        function cerrarModal(id) { document.getElementById(id).classList.add('hidden'); }

        async function guardarReasignacion() {
            const asesorSlug = document.getElementById('hidden-asesor-slug').value;
            let nuevoGerenteId = document.getElementById('select-gerente').value;
            if (nuevoGerenteId === 'null') nuevoGerenteId = null;

            const btn = event.target;
            btn.innerText = "PROCESANDO..."; btn.disabled = true;

            try {
                const { error } = await _supabase.from('vendedores').update({ gerente_id: nuevoGerenteId }).eq('slug', asesorSlug);
                if (error) throw error;
                cerrarModal('modal-reasignar');
                await cargarVendedores(); 
            } catch (error) {
                alert("Error de red: " + error.message);
            } finally {
                btn.innerText = "CONFIRMAR CAMBIO"; btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
