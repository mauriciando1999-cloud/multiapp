<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido | Multiamerica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Montserrat:ital,wght@1,900&family=Roboto+Mono&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            margin: 0; padding: 0; font-family: 'Inter', sans-serif;
            overflow: hidden; background-color: #000;
        }

        #video-background {
            position: fixed; right: 0; bottom: 0;
            min-width: 100%; min-height: 100%;
            z-index: -2; object-fit: cover; opacity: 0.8;
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.2) 100%);
            backdrop-filter: blur(8px); z-index: -1;
        }

        .font-title { font-family: 'Montserrat', sans-serif; font-weight: 900; font-style: italic; letter-spacing: -0.05em; }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            box-shadow: 0 40px 100px rgba(0,0,0,0.15);
        }

        .input-premium {
            border: 2px solid transparent; background: #f3f4f6;
            transition: all 0.3s ease;
        }
        .input-premium:focus {
            background: #ffffff; border-color: #FF8801; outline: none;
            box-shadow: 0 10px 25px rgba(255, 136, 1, 0.1);
        }

        .btn-primary {
            background: #000000; color: #ffffff;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-primary:hover:not(:disabled) { background: #FF8801; transform: translateY(-2px); }
        .btn-primary:disabled { background: #cccccc; cursor: not-allowed; transform: none; }
        .btn-primary:active:not(:disabled) { transform: scale(0.98); }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF8801">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Central">
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <video autoplay muted loop playsinline id="video-background">
        <source src="videojeep.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="max-w-md w-full space-y-6 relative z-10">
        <header class="text-center space-y-2 flex flex-col items-center">
            <img src="logo.png" alt="Multiamerica Vehiculos" class="w-56 h-auto drop-shadow-xl">
            <span class="font-mono text-[9px] uppercase tracking-[0.4em] text-gray-800 font-bold">Módulo de Administración</span>
        </header>

        <div class="login-card p-10 rounded-[40px] space-y-6">
            <div id="auth-form" class="space-y-5">
                
                <div class="space-y-1">
                    <label class="font-mono text-[9px] uppercase tracking-widest text-gray-500 font-bold ml-1">ID Operador (Email)</label>
                    <input type="email" id="email" placeholder="gerencia@multiamerica.com" 
                        class="input-premium w-full p-4 rounded-2xl text-sm font-bold text-black placeholder-gray-400">
                </div>

                <div class="space-y-1 relative">
                    <label class="font-mono text-[9px] uppercase tracking-widest text-gray-500 font-bold ml-1">Security Key</label>
                    <input type="password" id="password" placeholder="••••••••" 
                        class="input-premium w-full p-4 rounded-2xl text-sm font-bold text-black placeholder-gray-400">
                    <button type="button" onclick="togglePassword()" class="absolute right-4 top-9 text-gray-400 hover:text-black transition-colors">
                        <i class="fa-solid fa-eye" id="eye-icon"></i>
                    </button>
                </div>

                <button onclick="handleAuth()" id="main-btn" class="btn-primary w-full py-5 rounded-2xl font-black uppercase tracking-widest text-xs mt-4">
                    Autorizar Acceso →
                </button>
            </div>

            <div id="status-msg" class="text-[10px] font-black uppercase text-center hidden tracking-widest p-4 rounded-xl border"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const _supabase = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

        // Si ya hay una sesión guardada (login previo), saltamos directo al
        // dashboard. Sin esto, como index.html es el start_url de la PWA,
        // cada vez que se abre la app instalada te manda al login de nuevo
        // aunque la sesión siga viva — se siente como si "no recordara" al
        // usuario cuando en realidad nadie revisaba si ya estaba logueado.
        if (localStorage.getItem('operador_email')) {
            window.location.href = 'dashboard.html';
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function showStatus(msg, isError = true) {
            const el = document.getElementById('status-msg');
            el.innerHTML = isError ? `<i class="fa-solid fa-triangle-exclamation mr-1"></i> ${msg}` : `<i class="fa-solid fa-check-circle mr-1"></i> ${msg}`;
            el.className = `text-[10px] font-black uppercase text-center tracking-widest p-4 rounded-xl block border ${isError ? 'bg-red-50 text-red-600 border-red-200' : 'bg-green-50 text-green-700 border-green-200'}`;
            el.classList.remove('hidden');
        }

        function hideStatus() { document.getElementById('status-msg').classList.add('hidden'); }

        // Función para extraer el rol de la Whitelist (via RPC segura,
        // la tabla whitelist ya no es legible directamente por el cliente)
        async function fetchUserRole(email) {
            const { data, error } = await _supabase.rpc('check_whitelist', { p_email: email });
            if (error || !data) return 'vendedor'; // Default si no está o hay error
            return data;
        }

        async function handleAuth() {
            const emailInput = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('main-btn');

            if (!emailInput || !password) {
                showStatus("Faltan credenciales operativas");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> PROCESANDO...`;
            hideStatus();

            try {
                const { data, error: loginError } = await _supabase.auth.signInWithPassword({
                    email: emailInput, password: password
                });

                if (loginError) throw new Error("Credenciales inválidas o cuenta no registrada.");

                // EXTRAER ROL
                const rolAsignado = await fetchUserRole(emailInput);

                // Verificar permisos
                if (rolAsignado !== 'admin' && rolAsignado !== 'gerente') {
                    await _supabase.auth.signOut();
                    throw new Error("Su cuenta no tiene privilegios administrativos.");
                }

                // GUARDAR VARIABLES DE SESIÓN
                localStorage.setItem('operador_email', emailInput);
                localStorage.setItem('operador_rol', rolAsignado);

                // Guardamos tambien el slug/nombre del vendedor (si existe
                // una fila propia en vendedores) para las metricas por
                // gerente del dashboard y los mensajes de WhatsApp.
                const { data: vendedorPropio } = await _supabase
                    .from('vendedores')
                    .select('slug, nombre')
                    .eq('email', emailInput)
                    .maybeSingle();
                if (vendedorPropio) {
                    localStorage.setItem('vendedor_slug', vendedorPropio.slug || '');
                    localStorage.setItem('operador_nombre', vendedorPropio.nombre || '');
                }

                btn.innerHTML = `<i class="fa-solid fa-unlock"></i> ACCESO CONCEDIDO`;
                btn.classList.replace('bg-black', 'bg-green-600');
                setTimeout(() => window.location.href = 'dashboard.html', 800);

            } catch (err) {
                console.error(err);
                showStatus(err.message);
                btn.disabled = false;
                btn.innerText = "AUTORIZAR ACCESO →";
            }
        }

        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleAuth();
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
        }
    </script>
</body>
</html>
