<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leads Showroom | Multiamerica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Montserrat:ital,wght@1,900&display=swap" rel="stylesheet">

    <style>
        body { background-color: #f8f9fa; color: #0a0a0a; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .font-title { font-family: 'Montserrat', sans-serif; font-weight: 900; font-style: italic; letter-spacing: -0.04em; }
        .bg-grid { background-image: radial-gradient(circle, #e5e7eb 1px, transparent 1px); background-size: 24px 24px; }
        .bento-card { background: #ffffff; border: 1px solid #f3f4f6; border-radius: 24px; box-shadow: 0 10px 40px -10px rgba(0,0,0,0.04); }
    </style>
</head>
<body class="bg-grid min-h-screen pb-12">

    <main class="max-w-[1000px] mx-auto p-4 md:p-8">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
            <div>
                <a href="dashboard.html" class="inline-flex items-center gap-2 text-gray-400 hover:text-orange-600 font-black uppercase text-[10px] tracking-widest mb-2 transition-colors">
                    ← Volver a Central
                </a>
                <h1 class="text-6xl md:text-8xl font-title uppercase leading-[0.85] tracking-tight text-[#FF8801]">LEADS.</h1>
                <p class="text-xs text-gray-400 font-bold uppercase tracking-widest mt-2">Consultas y citas del Showroom</p>
            </div>
            <div class="flex gap-2">
                <button onclick="filtrarPor('todos')" class="filtro-btn px-4 py-2.5 rounded-full text-[10px] font-black uppercase tracking-widest bg-black text-white" data-filtro="todos">Todos</button>
                <button onclick="filtrarPor('Pendiente')" class="filtro-btn px-4 py-2.5 rounded-full text-[10px] font-black uppercase tracking-widest bg-gray-100 text-gray-500" data-filtro="Pendiente">Pendientes</button>
                <button onclick="filtrarPor('Contactado')" class="filtro-btn px-4 py-2.5 rounded-full text-[10px] font-black uppercase tracking-widest bg-gray-100 text-gray-500" data-filtro="Contactado">Contactados</button>
            </div>
        </header>

        <div id="lista-leads" class="space-y-4">
            <div class="text-center py-10 text-gray-400 font-bold uppercase text-xs italic">Sincronizando...</div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const _supabase = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
        if (!localStorage.getItem('operador_email')) { window.location.href = 'index.html'; }

        let todosLosLeads = [];
        let filtroActual = 'todos';

        async function cargarLeads() {
            const { data, error } = await _supabase
                .from('consultas_showroom')
                .select('*')
                .order('creado_el', { ascending: false });

            if (error) {
                document.getElementById('lista-leads').innerHTML = `<p class="text-xs text-red-500 font-bold text-center py-10">Error: ${error.message}</p>`;
                return;
            }
            todosLosLeads = data || [];
            renderLeads();
        }

        function filtrarPor(filtro) {
            filtroActual = filtro;
            document.querySelectorAll('.filtro-btn').forEach(b => {
                const activo = b.dataset.filtro === filtro;
                b.classList.toggle('bg-black', activo);
                b.classList.toggle('text-white', activo);
                b.classList.toggle('bg-gray-100', !activo);
                b.classList.toggle('text-gray-500', !activo);
            });
            renderLeads();
        }

        function renderLeads() {
            const cont = document.getElementById('lista-leads');
            const datos = filtroActual === 'todos' ? todosLosLeads : todosLosLeads.filter(l => l.estatus === filtroActual);

            if (datos.length === 0) {
                cont.innerHTML = `<p class="text-xs text-gray-400 font-bold uppercase text-center py-10 italic">Sin registros</p>`;
                return;
            }

            cont.innerHTML = datos.map(l => {
                const esCita = l.tipo === 'Cita';
                const badgeColor = l.estatus === 'Contactado' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700';
                const listaAutos = (l.vehiculos || []).join(', ') || 'tu selección';
                const nombreGerente = (l.gerente_nombre || '').split(' ')[0] || 'un asesor';
                const mensajeWa = esCita
                    ? `¡Hola ${l.cliente_nombre || ''}! Soy ${nombreGerente} de Multiamerica, te escribo para confirmar tu cita del ${l.fecha_hora || ''} ${l.ubicacion ? 'en ' + l.ubicacion : ''} por: ${listaAutos}.`
                    : `¡Hola ${l.cliente_nombre || ''}! Soy ${nombreGerente} de Multiamerica, vi que consultaste por: ${listaAutos}. ¿Conversamos?`;
                const waLink = l.cliente_telefono
                    ? `https://wa.me/${l.cliente_telefono.replace(/\D/g, '')}?text=${encodeURIComponent(mensajeWa)}`
                    : null;

                return `
                <div class="bento-card p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-2 flex-wrap">
                            <span class="text-[9px] font-black uppercase px-2.5 py-1 rounded-lg ${esCita ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}">${l.tipo}</span>
                            <span class="text-[9px] font-black uppercase px-2.5 py-1 rounded-lg ${badgeColor}">${l.estatus}</span>
                            <span class="text-[9px] text-gray-400 font-bold">${new Date(l.creado_el).toLocaleString('es-VE')}</span>
                        </div>
                        <h3 class="font-black text-lg uppercase italic">${l.cliente_nombre || 'Sin nombre (vía Agendar)'} ${l.cliente_telefono ? `· ${l.cliente_telefono}` : ''}</h3>
                        <p class="text-xs text-gray-500 font-bold mt-1">${(l.vehiculos || []).join(', ') || 'Sin vehículos'}</p>
                        ${l.fecha_hora ? `<p class="text-xs text-gray-400 font-bold mt-1"><i class="fa-regular fa-calendar mr-1"></i> ${l.fecha_hora} ${l.ubicacion ? '· ' + l.ubicacion : ''}</p>` : ''}
                        <p class="text-[10px] text-gray-400 font-bold uppercase mt-2">Asignado a: <span class="text-black">${l.gerente_nombre || 'Sin asignar'}</span></p>
                    </div>
                    <div class="flex gap-2 flex-shrink-0">
                        ${waLink ? `<a href="${waLink}" target="_blank" class="bg-[#25D366] text-white px-4 py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest flex items-center gap-2"><i class="fa-brands fa-whatsapp"></i> Contactar</a>` : ''}
                        ${l.estatus !== 'Contactado' ? `<button onclick="marcarContactado('${l.id}')" class="bg-gray-100 text-black px-4 py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-black hover:text-white transition-all">Marcar Contactado</button>` : ''}
                    </div>
                </div>`;
            }).join('');
        }

        async function marcarContactado(id) {
            const { error } = await _supabase.from('consultas_showroom').update({ estatus: 'Contactado' }).eq('id', id);
            if (!error) {
                const item = todosLosLeads.find(l => l.id === id);
                if (item) item.estatus = 'Contactado';
                renderLeads();
            }
        }

        cargarLeads();
    </script>
</body>
</html>
