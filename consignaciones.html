<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consignaciones | Multiamerica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Montserrat:ital,wght@1,900&display=swap" rel="stylesheet">

    <style>
        :root {
            --neu-bg: #e7e8ee;
            --neu-text: #35354a;
            --neu-text-muted: #8890a3;
            --neu-light: #ffffff;
            --neu-dark: #c3c5d1;
            --neu-accent: linear-gradient(135deg, #ff9d3d, #ff8801);
        }
        body { background-color: var(--neu-bg); color: var(--neu-text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .font-title { font-family: 'Montserrat', sans-serif; font-weight: 900; font-style: italic; letter-spacing: -0.04em; }
        .text-muted { color: var(--neu-text-muted); }
        .neu-card { background: var(--neu-bg); border-radius: 24px; box-shadow: 8px 8px 16px var(--neu-dark), -8px -8px 16px var(--neu-light); transition: all 0.2s ease; }
        .neu-card-sm { background: var(--neu-bg); border-radius: 16px; box-shadow: 6px 6px 12px var(--neu-dark), -6px -6px 12px var(--neu-light); transition: all 0.2s ease; }
        .neu-pressable:active { box-shadow: inset 4px 4px 9px var(--neu-dark), inset -4px -4px 9px var(--neu-light); transform: scale(0.98); }
        .filtro-btn.activo { background: var(--neu-accent); color: #fff; box-shadow: 4px 4px 10px rgba(200,110,10,0.28), -3px -3px 8px rgba(255,255,255,0.7); }
        .filtro-btn:not(.activo) { background: var(--neu-bg); color: var(--neu-text-muted); box-shadow: 4px 4px 9px var(--neu-dark), -4px -4px 9px var(--neu-light); }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF8801">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Central">
</head>
<body class="min-h-screen pb-12">

    <main class="max-w-[1000px] mx-auto p-4 md:p-8">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 sm:gap-6 mb-6 sm:mb-10 pt-2">
            <div>
                <a href="dashboard.html" class="inline-flex items-center gap-2 text-muted hover:text-orange-600 font-black uppercase text-[10px] tracking-widest mb-2 transition-colors">
                    ← Volver a Central
                </a>
                <h1 class="text-4xl sm:text-6xl md:text-8xl font-title uppercase leading-[0.85] tracking-tight text-[#FF8801]">CONSIGNAR.</h1>
                <p class="text-xs text-muted font-bold uppercase tracking-widest mt-2">Autos que clientes quieren vender</p>
            </div>
            <div class="flex gap-2 flex-wrap">
                <button onclick="filtrarPor('todos')" class="filtro-btn neu-pressable activo px-3 sm:px-4 py-2.5 rounded-full text-[9px] sm:text-[10px] font-black uppercase tracking-widest" data-filtro="todos">Todas</button>
                <button onclick="filtrarPor('pendientes')" class="filtro-btn neu-pressable px-3 sm:px-4 py-2.5 rounded-full text-[9px] sm:text-[10px] font-black uppercase tracking-widest" data-filtro="pendientes">Pendientes</button>
                <button onclick="filtrarPor('Aprobado')" class="filtro-btn neu-pressable px-3 sm:px-4 py-2.5 rounded-full text-[9px] sm:text-[10px] font-black uppercase tracking-widest" data-filtro="Aprobado">Aprobadas</button>
                <button onclick="filtrarPor('Promovido a Inventario')" class="filtro-btn neu-pressable px-3 sm:px-4 py-2.5 rounded-full text-[9px] sm:text-[10px] font-black uppercase tracking-widest" data-filtro="Promovido a Inventario">En Stock</button>
                <button onclick="filtrarPor('Rechazado')" class="filtro-btn neu-pressable px-3 sm:px-4 py-2.5 rounded-full text-[9px] sm:text-[10px] font-black uppercase tracking-widest" data-filtro="Rechazado">Rechazadas</button>
            </div>
        </header>

        <div id="lista-consignaciones" class="space-y-4">
            <div class="text-center py-10 text-muted font-bold uppercase text-xs italic">Sincronizando...</div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const _supabase = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
        if (!localStorage.getItem('operador_email')) { window.location.href = 'index.html'; }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        const PENDIENTES = ['Pendiente de Revisión', 'Agendado'];
        let todasLasConsignaciones = [];
        let filtroActual = 'todos';

        async function cargarConsignaciones() {
            const { data, error } = await _supabase
                .from('consignaciones')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                document.getElementById('lista-consignaciones').innerHTML = `<p class="text-xs text-red-500 font-bold text-center py-10">Error: ${error.message}</p>`;
                return;
            }
            todasLasConsignaciones = data || [];
            render();
        }

        function filtrarPor(filtro) {
            filtroActual = filtro;
            document.querySelectorAll('.filtro-btn').forEach(b => {
                b.classList.toggle('activo', b.dataset.filtro === filtro);
            });
            render();
        }

        function render() {
            const cont = document.getElementById('lista-consignaciones');
            const datos = filtroActual === 'todos'
                ? todasLasConsignaciones
                : filtroActual === 'pendientes'
                    ? todasLasConsignaciones.filter(c => PENDIENTES.includes(c.estatus))
                    : todasLasConsignaciones.filter(c => c.estatus === filtroActual);

            if (datos.length === 0) {
                cont.innerHTML = `<p class="text-xs text-muted font-bold uppercase text-center py-10 italic">Sin registros</p>`;
                return;
            }

            const badgeColores = {
                'Pendiente de Revisión': 'bg-orange-100 text-orange-700',
                'Agendado': 'bg-blue-100 text-blue-700',
                'Aprobado': 'bg-green-100 text-green-700',
                'Rechazado': 'bg-red-100 text-red-700',
                'Promovido a Inventario': 'bg-purple-100 text-purple-700',
            };

            cont.innerHTML = datos.map(c => {
                const badgeColor = badgeColores[c.estatus] || 'bg-gray-100 text-gray-700';
                const tieneFoto = c.fotos && c.fotos.length > 0;
                const fotoUrl = tieneFoto ? _supabase.storage.from('autos').getPublicUrl(c.fotos[0]).data.publicUrl : null;

                return `
                <a href="revision_detalle.html?id=${c.id}" class="neu-card p-4 sm:p-5 flex items-center gap-4">
                    <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl overflow-hidden bg-black/5 flex-shrink-0 flex items-center justify-center">
                        ${fotoUrl ? `<img src="${fotoUrl}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-car text-muted text-xl"></i>`}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1.5 flex-wrap">
                            <span class="text-[9px] font-black uppercase px-2.5 py-1 rounded-lg ${badgeColor}">${escapeHtml(c.estatus)}</span>
                            <span class="text-[9px] text-muted font-bold">${escapeHtml(new Date(c.created_at).toLocaleDateString('es-VE'))}</span>
                        </div>
                        <h3 class="font-black text-sm sm:text-base uppercase italic truncate">${escapeHtml(c.vehiculo) || 'Sin vehículo'} ${c.anio ? `· ${c.anio}` : ''}</h3>
                        <p class="text-xs text-muted font-bold mt-0.5 truncate">${escapeHtml(c.nombre) || 'Sin nombre'} ${c.telefono ? `· ${escapeHtml(c.telefono)}` : ''}</p>
                        <p class="text-[10px] text-muted font-bold uppercase mt-1">Asignado a: <span class="text-black">${escapeHtml(c.gerente_nombre) || 'Sin asignar'}</span></p>
                    </div>
                    <div class="text-right flex-shrink-0 hidden sm:block">
                        ${c.precio ? `<p class="text-lg font-title italic font-black text-[#FF8801]">$${Number(c.precio).toLocaleString()}</p>` : ''}
                        <i class="fa-solid fa-chevron-right text-muted mt-2"></i>
                    </div>
                </a>`;
            }).join('');
        }

        cargarConsignaciones();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
        }
    </script>
</body>
</html>
