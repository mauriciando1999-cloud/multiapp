<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leads Showroom | Multiamerica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Montserrat:ital,wght@1,900&display=swap" rel="stylesheet">

    <style>
        :root {
            --neu-bg: #e7e8ee;
            --neu-text: #35354a;
            --neu-text-muted: #8890a3;
            --neu-light: #ffffff;
            --neu-dark: #c3c5d1;
            --neu-accent: linear-gradient(135deg, #ff9d3d, #ff8801);
        }
        body { background-color: var(--neu-bg); color: var(--neu-text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .font-title { font-family: 'Montserrat', sans-serif; font-weight: 900; font-style: italic; letter-spacing: -0.04em; }
        .text-muted { color: var(--neu-text-muted); }
        .neu-card { background: var(--neu-bg); border-radius: 24px; box-shadow: 8px 8px 16px var(--neu-dark), -8px -8px 16px var(--neu-light); transition: all 0.2s ease; }
        .neu-card-sm { background: var(--neu-bg); border-radius: 16px; box-shadow: 6px 6px 12px var(--neu-dark), -6px -6px 12px var(--neu-light); transition: all 0.2s ease; }
        .neu-pressable:active { box-shadow: inset 4px 4px 9px var(--neu-dark), inset -4px -4px 9px var(--neu-light); transform: scale(0.98); }
        .filtro-btn.activo { background: var(--neu-accent); color: #fff; box-shadow: 4px 4px 10px rgba(200,110,10,0.28), -3px -3px 8px rgba(255,255,255,0.7); }
        .filtro-btn:not(.activo) { background: var(--neu-bg); color: var(--neu-text-muted); box-shadow: 4px 4px 9px var(--neu-dark), -4px -4px 9px var(--neu-light); }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF8801">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Central">
</head>
<body class="min-h-screen pb-12">

    <main class="max-w-[1000px] mx-auto p-4 md:p-8">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 sm:gap-6 mb-6 sm:mb-10 pt-2">
            <div>
                <a href="dashboard.html" class="inline-flex items-center gap-2 text-muted hover:text-orange-600 font-black uppercase text-[10px] tracking-widest mb-2 transition-colors">
                    ← Volver a Central
                </a>
                <h1 class="text-4xl sm:text-6xl md:text-8xl font-title uppercase leading-[0.85] tracking-tight text-[#FF8801]">LEADS.</h1>
                <p class="text-xs text-muted font-bold uppercase tracking-widest mt-2">Consultas y citas del Showroom</p>
            </div>
            <div class="flex gap-2">
                <button onclick="filtrarPor('todos')" class="filtro-btn neu-pressable activo px-3 sm:px-4 py-2.5 rounded-full text-[9px] sm:text-[10px] font-black uppercase tracking-widest" data-filtro="todos">Todos</button>
                <button onclick="filtrarPor('Pendiente')" class="filtro-btn neu-pressable px-3 sm:px-4 py-2.5 rounded-full text-[9px] sm:text-[10px] font-black uppercase tracking-widest" data-filtro="Pendiente">Pendientes</button>
                <button onclick="filtrarPor('Contactado')" class="filtro-btn neu-pressable px-3 sm:px-4 py-2.5 rounded-full text-[9px] sm:text-[10px] font-black uppercase tracking-widest" data-filtro="Contactado">Contactados</button>
            </div>
        </header>

        <div id="lista-leads" class="space-y-4">
            <div class="text-center py-10 text-muted font-bold uppercase text-xs italic">Sincronizando...</div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const _supabase = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
        const uEmail = localStorage.getItem('operador_email');
        if (!uEmail) { window.location.href = 'index.html'; }

        const WEB_BASE_URL = 'https://multiamerica-web.vercel.app';

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        let todosLosLeads = [];
        let filtroActual = 'todos';
        let vehiculosPorId = {};
        let leadsConVenta = new Set();
        // Nombre de quien esta operando la sesion, no el gerente al que el
        // lead se le asigno al azar en la web publica: el mensaje debe
        // presentarse con el nombre de quien realmente escribe.
        let miNombre = null;

        async function cargarMiNombre() {
            const { data } = await _supabase.from('vendedores').select('nombre').eq('email', uEmail).maybeSingle();
            miNombre = data?.nombre || null;
        }

        async function cargarLeads() {
            const { data, error } = await _supabase
                .from('consultas_showroom')
                .select('*')
                .order('creado_el', { ascending: false });

            if (error) {
                document.getElementById('lista-leads').innerHTML = `<p class="text-xs text-red-500 font-bold text-center py-10">Error: ${error.message}</p>`;
                return;
            }
            todosLosLeads = data || [];

            const idsUnicos = [...new Set(todosLosLeads.flatMap(l => l.vehiculo_ids || []))];
            if (idsUnicos.length > 0) {
                const { data: autos } = await _supabase
                    .from('inventario')
                    .select('id, marca, modelo, anio, precio_venta, kilometraje, transmision, fotos')
                    .in('id', idsUnicos);
                (autos || []).forEach(a => vehiculosPorId[a.id] = a);
            }

            const leadIds = todosLosLeads.map(l => l.id);
            if (leadIds.length > 0) {
                const { data: ventasVinculadas } = await _supabase
                    .from('ventas')
                    .select('lead_showroom_id')
                    .in('lead_showroom_id', leadIds);
                leadsConVenta = new Set((ventasVinculadas || []).map(v => v.lead_showroom_id));
            }

            renderLeads();
        }

        function filtrarPor(filtro) {
            filtroActual = filtro;
            document.querySelectorAll('.filtro-btn').forEach(b => {
                b.classList.toggle('activo', b.dataset.filtro === filtro);
            });
            renderLeads();
        }

        function renderLeads() {
            const cont = document.getElementById('lista-leads');
            const datos = filtroActual === 'todos' ? todosLosLeads : todosLosLeads.filter(l => l.estatus === filtroActual);

            if (datos.length === 0) {
                cont.innerHTML = `<p class="text-xs text-muted font-bold uppercase text-center py-10 italic">Sin registros</p>`;
                return;
            }

            cont.innerHTML = datos.map(l => {
                const esCita = l.tipo === 'Cita';
                const badgeColor = l.estatus === 'Contactado' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700';
                const tieneWa = !!l.cliente_telefono;

                const chipsAutos = (l.vehiculo_ids && l.vehiculo_ids.length > 0)
                    ? l.vehiculo_ids.map((vid, i) => {
                        const auto = vehiculosPorId[vid];
                        const etiqueta = auto ? `${auto.marca} ${auto.modelo}` : (l.vehiculos || [])[i] || 'Vehículo';
                        return auto
                            ? `<a href="detalle.html?id=${vid}" target="_blank" class="inline-block bg-white/60 hover:bg-white text-[10px] font-black uppercase px-2.5 py-1 rounded-lg border border-black/5 mr-1 mt-1 transition-colors">${escapeHtml(etiqueta)} <i class="fa-solid fa-arrow-up-right-from-square text-[8px] ml-0.5 text-muted"></i></a>`
                            : `<span class="inline-block text-[10px] font-bold uppercase px-2.5 py-1 mr-1 mt-1 text-muted">${escapeHtml(etiqueta)}</span>`;
                    }).join('')
                    : `<p class="text-xs text-muted font-bold mt-1">${escapeHtml((l.vehiculos || []).join(', ')) || 'Sin vehículos'}</p>`;

                return `
                <div class="neu-card p-5 sm:p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-2 flex-wrap">
                            <span class="text-[9px] font-black uppercase px-2.5 py-1 rounded-lg ${esCita ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}">${escapeHtml(l.tipo)}</span>
                            <span class="text-[9px] font-black uppercase px-2.5 py-1 rounded-lg ${badgeColor}">${escapeHtml(l.estatus)}</span>
                            ${leadsConVenta.has(l.id) ? `<span class="text-[9px] font-black uppercase px-2.5 py-1 rounded-lg bg-green-600 text-white"><i class="fa-solid fa-circle-check mr-1"></i>Convertido en Venta</span>` : ''}
                            <span class="text-[9px] text-muted font-bold">${escapeHtml(new Date(l.creado_el).toLocaleString('es-VE'))}</span>
                        </div>
                        <h3 class="font-black text-base sm:text-lg uppercase italic truncate">${escapeHtml(l.cliente_nombre) || 'Sin nombre (vía Agendar)'} ${l.cliente_telefono ? `· ${escapeHtml(l.cliente_telefono)}` : ''}</h3>
                        <div class="mt-1">${chipsAutos}</div>
                        ${l.fecha_hora ? `<p class="text-xs text-muted font-bold mt-1"><i class="fa-regular fa-calendar mr-1"></i> ${escapeHtml(l.fecha_hora)} ${l.ubicacion ? '· ' + escapeHtml(l.ubicacion) : ''}</p>` : ''}
                        <p class="text-[10px] text-muted font-bold uppercase mt-2">Asignado a: <span class="text-black">${escapeHtml(l.gerente_nombre) || 'Sin asignar'}</span></p>
                    </div>
                    <div class="flex gap-2 flex-shrink-0">
                        ${tieneWa ? `<button onclick="contactarLead('${l.id}')" class="neu-card-sm neu-pressable bg-[#25D366] text-white px-4 py-3 text-[10px] font-black uppercase tracking-widest flex items-center gap-2"><i class="fa-brands fa-whatsapp"></i> Contactar</button>` : ''}
                        ${l.estatus !== 'Contactado' ? `<button onclick="marcarContactado('${l.id}')" class="neu-card-sm neu-pressable text-black px-4 py-3 text-[10px] font-black uppercase tracking-widest">Marcar Contactado</button>` : ''}
                    </div>
                </div>`;
            }).join('');
        }

        async function marcarContactado(id) {
            const { error } = await _supabase.from('consultas_showroom').update({ estatus: 'Contactado' }).eq('id', id);
            if (!error) {
                const item = todosLosLeads.find(l => l.id === id);
                if (item) item.estatus = 'Contactado';
                renderLeads();
            }
        }

        // Une cada vehículo con el link a su ficha real en la web publica
        // (si tenemos el id) para que el cliente pueda verla sin PDFs.
        function listaVehiculosConLink(l) {
            if (l.vehiculo_ids && l.vehiculo_ids.length > 0) {
                return l.vehiculo_ids.map((vid, i) => {
                    const auto = vehiculosPorId[vid];
                    const etiqueta = auto ? `${auto.marca} ${auto.modelo}` : (l.vehiculos || [])[i] || 'Vehículo';
                    return `🚗 ${etiqueta}: ${WEB_BASE_URL}/detalle.html?id=${vid}`;
                }).join('\n');
            }
            return (l.vehiculos || []).map(nombre => `🚗 ${nombre}`).join('\n') || '🚗 tu selección';
        }

        function construirMensajeWa(l) {
            const esCita = l.tipo === 'Cita';
            const nombreGerente = (miNombre || l.gerente_nombre || '').split(' ')[0] || 'un asesor';
            const listaAutos = listaVehiculosConLink(l);
            return esCita
                ? `¡Hola ${l.cliente_nombre || ''}! 👋\n\nSoy *${nombreGerente}* de Multiamerica.\n\nTe escribo para confirmar tu cita del *${l.fecha_hora || ''}*${l.ubicacion ? ` en ${l.ubicacion}` : ''} por:\n${listaAutos}\n\n¿Confirmamos?`
                : `¡Hola ${l.cliente_nombre || ''}! 👋\n\nSoy *${nombreGerente}* de Multiamerica.\n\nVi que consultaste por:\n${listaAutos}\n\n¿Conversamos? Estoy para ayudarte.`;
        }

        function contactarLead(id) {
            const lead = todosLosLeads.find(l => l.id === id);
            if (!lead || !lead.cliente_telefono) return;

            const mensajeWa = construirMensajeWa(lead);
            window.open(`https://wa.me/${lead.cliente_telefono.replace(/\D/g, '')}?text=${encodeURIComponent(mensajeWa)}`, '_blank');

            if (lead.estatus !== 'Contactado') marcarContactado(id);
        }

        cargarMiNombre();
        cargarLeads();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
        }
    </script>
</body>
</html>
