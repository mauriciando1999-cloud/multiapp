<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANÁLISIS DE VENTAS | CENTRAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Montserrat:ital,wght@1,900&family=Roboto+Mono&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { background-color: #ffffff; color: #111; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .font-title { font-family: 'Montserrat', sans-serif; font-weight: 900; font-style: italic; letter-spacing: -0.05em; }
        .bg-grid { background-image: radial-gradient(circle, #f0f0f0 1px, transparent 1px); background-size: 30px 30px; }
        .glass-card { background: #ffffff; border: 1px solid #f0f0f0; transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02); }
        .stat-card { border-left: 6px solid #111; }
        .stat-card.orange { border-left-color: #FF8801; }
        canvas { max-height: 280px !important; width: 100% !important; }

        /* Estilos específicos para el reporte PDF */
        @media print {
            .no-print { display: none !important; }
            .bg-grid { background-image: none !important; }
            body { padding: 0 !important; }
            .glass-card { box-shadow: none !important; border: 1px solid #eee !important; }
        }
    </style>
</head>
<body class="bg-grid min-h-screen pb-24">

    <main id="reporte-contenido" class="max-w-7xl mx-auto p-4 md:p-12">
        <header class="mb-16 flex flex-col md:flex-row justify-between items-end gap-8">
            <div>
                <a href="dashboard.html" class="no-print text-[10px] font-black uppercase tracking-[0.3em] text-gray-400 hover:text-black mb-4 block">← Panel Central</a>
                <h1 class="text-6xl md:text-8xl font-title uppercase leading-[0.8]">ANÁLISIS<br>VENTAS.</h1>
            </div>
            <div class="flex gap-4 w-full md:w-auto">
                <div class="glass-card stat-card p-6 rounded-[30px] flex-1 md:min-w-[180px]">
                    <p class="text-[8px] font-black uppercase text-gray-400 tracking-widest mb-2">Volumen Total</p>
                    <p class="text-3xl font-title italic text-black" id="total-volumen">$0</p>
                </div>
                <div class="glass-card stat-card orange p-6 rounded-[30px] flex-1 md:min-w-[180px]">
                    <p class="text-[8px] font-black uppercase text-gray-400 tracking-widest mb-2">Cierres Totales</p>
                    <p class="text-3xl font-title italic text-[#FF8801]" id="total-ventas">0</p>
                </div>
            </div>
        </header>

        <div class="flex flex-col md:flex-row gap-4 mb-12 no-print">
            <div class="relative flex-1">
                <input type="text" id="venta-search" oninput="filtrarVentas()" placeholder="BUSCAR ASESOR O UNIDAD..." 
                    class="w-full bg-white border border-gray-100 py-4 px-6 rounded-2xl text-[10px] font-bold uppercase tracking-widest outline-none focus:border-[#FF8801] shadow-sm">
            </div>
            <button onclick="descargarReporte()" class="bg-black text-white px-8 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-lg hover:bg-[#FF8801] transition-all flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Generar Reporte PDF
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-16">
            <div class="glass-card p-8 rounded-[40px]">
                <h3 class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-6 italic">Ingresos por Mes</h3>
                <canvas id="chartVentas"></canvas>
            </div>
            <div class="glass-card p-8 rounded-[40px]">
                <h3 class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-6 italic">Ranking de Asesores</h3>
                <canvas id="chartAsesores"></canvas>
            </div>
        </div>

        <div class="glass-card rounded-[40px] overflow-hidden bg-white border border-gray-100">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-100">
                        <th class="p-6 text-[9px] font-black uppercase tracking-widest text-gray-400">Fecha</th>
                        <th class="p-6 text-[9px] font-black uppercase tracking-widest text-gray-400">Vehículo</th>
                        <th class="p-6 text-[9px] font-black uppercase tracking-widest text-gray-400">Vendedor</th>
                        <th class="p-6 text-[9px] font-black uppercase tracking-widest text-gray-400">Monto</th>
                        <th class="p-6 text-[9px] font-black uppercase tracking-widest text-gray-400">Comisión</th>
                    </tr>
                </thead>
                <tbody id="tabla-ventas-body"></tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const _db = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

        async function init() {
            const { data: ventas, error } = await _db.from('ventas').select('*').order('created_at', { ascending: true });
            if (error) return console.error(error);

            renderStats(ventas);
            renderCharts(ventas);
        }

        function renderStats(ventas) {
            const body = document.getElementById('tabla-ventas-body');
            let total = 0;
            document.getElementById('total-ventas').innerText = ventas.length;

            body.innerHTML = [...ventas].reverse().map(v => {
                total += v.precio_venta;
                return `
                    <tr class="border-b border-gray-50 hover:bg-gray-50/50 transition-colors venta-row" data-search="${v.vehiculo} ${v.vendedor}">
                        <td class="p-6 text-[10px] font-mono font-bold text-gray-400">${new Date(v.created_at).toLocaleDateString()}</td>
                        <td class="p-6 text-xs font-black uppercase">${v.vehiculo}</td>
                        <td class="p-6 text-xs font-bold text-gray-500 uppercase">${v.vendedor}</td>
                        <td class="p-6 text-sm font-title italic font-black text-black">$${v.precio_venta.toLocaleString()}</td>
                        <td class="p-6"><span class="bg-orange-50 text-[#FF8801] px-3 py-1 rounded-lg text-[10px] font-black">+$${v.comision}</span></td>
                    </tr>`;
            }).join('');
            document.getElementById('total-volumen').innerText = `$${(total / 1000).toFixed(1)}k`;
        }

        function renderCharts(ventas) {
            // Lógica para Gráfica de Tendencia
            const meses = {};
            ventas.forEach(v => {
                const m = new Date(v.created_at).toLocaleString('es-ES', { month: 'short' }).toUpperCase();
                meses[m] = (meses[m] || 0) + v.precio_venta;
            });

            new Chart(document.getElementById('chartVentas'), {
                type: 'line',
                data: {
                    labels: Object.keys(meses),
                    datasets: [{
                        label: 'Ventas',
                        data: Object.values(meses),
                        borderColor: '#FF8801',
                        backgroundColor: 'rgba(255, 136, 1, 0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 4,
                        pointRadius: 0
                    }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
            });

            // Lógica para Gráfica de Vendedores
            const ranking = {};
            ventas.forEach(v => ranking[v.vendedor] = (ranking[v.vendedor] || 0) + 1);

            new Chart(document.getElementById('chartAsesores'), {
                type: 'bar',
                data: {
                    labels: Object.keys(ranking),
                    datasets: [{
                        data: Object.values(ranking),
                        backgroundColor: '#111',
                        borderRadius: 8
                    }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } }, x: { grid: { display: false } } } }
            });
        }

        function filtrarVentas() {
            const query = document.getElementById('venta-search').value.toLowerCase();
            document.querySelectorAll('.venta-row').forEach(row => {
                row.style.display = row.getAttribute('data-search').toLowerCase().includes(query) ? '' : 'none';
            });
        }

        function descargarReporte() {
            const element = document.getElementById('reporte-contenido');
            const opt = {
                margin: 0.5,
                filename: `Reporte_Multiamerica_${new Date().toLocaleDateString()}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        init();
    </script>
</body>
</html>
