<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Expediente Maestro | Multiamerica</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="config.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@1,900&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --neu-bg: #e7e8ee;
            --neu-text: #35354a;
            --neu-text-muted: #8890a3;
            --neu-light: #ffffff;
            --neu-dark: #c3c5d1;
        }
        body { background-color: var(--neu-bg); color: var(--neu-text); font-family: 'Montserrat', sans-serif; -webkit-font-smoothing: antialiased; }
        .text-muted { color: var(--neu-text-muted); }
        .neu-card { background: var(--neu-bg); border-radius: 2.5rem; box-shadow: 10px 10px 20px var(--neu-dark), -10px -10px 20px var(--neu-light); }
        .neu-card-sm { background: var(--neu-bg); border-radius: 999px; box-shadow: 6px 6px 12px var(--neu-dark), -6px -6px 12px var(--neu-light); transition: all 0.2s ease; }
        .neu-pressable:active { box-shadow: inset 4px 4px 9px var(--neu-dark), inset -4px -4px 9px var(--neu-light); transform: scale(0.98); }
        .glass-card { background: var(--neu-bg); border-radius: 2.5rem; box-shadow: 10px 10px 20px var(--neu-dark), -10px -10px 20px var(--neu-light); }
        .thumb-btn { transition: all 0.3s ease; filter: grayscale(100%); opacity: 0.6; border-radius: 1rem; box-shadow: 4px 4px 8px var(--neu-dark), -4px -4px 8px var(--neu-light); }
        .thumb-btn.active { filter: grayscale(0%); opacity: 1; box-shadow: 0 0 0 2px #FF8801; }
        .data-box { background: var(--neu-bg); padding: 15px; border-radius: 14px; box-shadow: inset 3px 3px 7px var(--neu-dark), inset -3px -3px 7px var(--neu-light); }
        .label-tech { font-size: 8px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--neu-text-muted); font-weight: 900; }
    </style>
</head>
<body class="p-3 sm:p-4 md:p-10">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-6 sm:mb-10 gap-3">
            <a href="inventario.html" class="neu-card-sm neu-pressable text-[10px] font-bold uppercase tracking-widest text-muted px-4 py-2 flex-shrink-0">← Volver</a>
            <div class="flex items-center gap-2 sm:gap-4">
                <button id="btn-pdf" onclick="generarFichaPDF()" class="neu-card-sm neu-pressable px-3 sm:px-5 py-2.5 text-[9px] font-black uppercase flex items-center gap-2">
                    <i class="fa-solid fa-file-pdf"></i> <span class="hidden sm:inline">Generar Ficha Pretext</span>
                </button>
                <div class="hidden md:block bg-black px-4 py-1.5 rounded-full text-[9px] font-black text-white uppercase tracking-widest">Central Command</div>
            </div>
        </header>

        <div id="detalle-main" class="grid grid-cols-1 lg:grid-cols-12 gap-6 sm:gap-10"></div>
    </div>

    <script>
        const _supabase = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
        const idUnidad = new URLSearchParams(window.location.search).get('id');
        
        const userEmail = localStorage.getItem('operador_email');
        const userRol = localStorage.getItem('operador_rol');

        let vehiculoActual = null;

        const CAMPOS_OMITIR = ['id', 'creado_el', 'created_at', 'fotos', 'marca', 'modelo', 'precio_venta', 'estatus', 'creado_por', 'updated_at'];

        async function cargarDetalle() {
            const { data: u, error } = await _supabase.from('inventario').select('*').eq('id', idUnidad).single();
            if (error || !u) return;
            
            vehiculoActual = u;
            const fotos = u.fotos && u.fotos.length > 0 ? u.fotos : [null];

            // Determinar si el usuario actual tiene permiso de editar
            // Admin tiene permiso total, Gerente solo si el campo 'creado_por' coincide con su email
            const tienePermisoEdicion = (userRol === 'admin' || u.creado_por === userEmail);

            let infoHtml = '';
            Object.entries(u).forEach(([key, value]) => {
                if (value && value !== "" && !CAMPOS_OMITIR.includes(key.toLowerCase())) {
                    const labelNice = key.replace(/_/g, ' ').toUpperCase();
                    const valorNice = typeof value === 'number' ? value.toLocaleString() : value;
                    infoHtml += `
                        <div class="data-box">
                            <p class="label-tech">${labelNice}</p>
                            <p class="text-sm font-black uppercase italic text-black leading-tight">${valorNice}</p>
                        </div>
                    `;
                }
            });

            document.getElementById('detalle-main').innerHTML = `
                <div class="lg:col-span-7 space-y-4 sm:space-y-6">
                    <div class="aspect-[16/10] overflow-hidden rounded-[2rem] sm:rounded-[2.5rem] shadow-xl bg-gray-100">
                        <img src="${getFotoUrl(fotos[0])}" id="main-view" class="w-full h-full object-cover">
                    </div>
                    <div class="grid grid-cols-6 gap-2 sm:gap-3">
                        ${fotos.map((f, i) => `
                            <button onclick="changeView('${getFotoUrl(f)}', this)" class="thumb-btn aspect-square overflow-hidden ${i===0?'active':''}">
                                <img src="${getFotoUrl(f)}" class="w-full h-full object-cover">
                            </button>
                        `).join('')}
                    </div>
                </div>

                <div class="lg:col-span-5">
                    <div class="glass-card p-6 sm:p-10 md:p-14">
                        <div class="flex justify-between items-start mb-6 gap-3">
                            <span class="neu-card-sm text-black/60 px-3 py-1 text-[9px] font-black uppercase tracking-widest">
                                ${u.estatus || 'DISPONIBLE'}
                            </span>
                            <div class="text-right flex-shrink-0">
                                <p class="label-tech">Originador</p>
                                <p class="text-[10px] font-bold uppercase tracking-tighter">${u.creado_por ? u.creado_por.split('@')[0] : 'SISTEMA'}</p>
                            </div>
                        </div>

                        <h1 class="text-4xl sm:text-6xl font-black italic uppercase leading-none mb-2">${u.marca}</h1>
                        <h2 class="text-2xl sm:text-4xl font-black italic uppercase text-muted leading-none mb-6 sm:mb-10">${u.modelo}</h2>

                        <p class="text-4xl sm:text-6xl font-black mb-6 sm:mb-10 leading-none">$${u.precio_venta?.toLocaleString()}</p>

                        <div class="grid grid-cols-2 gap-3 sm:gap-4 mb-6 sm:mb-10">
                            ${infoHtml}
                        </div>

                        <div class="space-y-4 pt-6 border-t border-black/5">
                            ${tienePermisoEdicion ? `
                                <button onclick="window.location.href='registro.html?id=${u.id}'" class="neu-card-sm neu-pressable w-full py-4 rounded-2xl font-bold uppercase text-[10px] tracking-widest">
                                    <i class="fa-solid fa-gear mr-2"></i> Editar Expediente
                                </button>
                            ` : `
                                <div class="p-4 bg-orange-50 rounded-2xl border border-orange-100">
                                    <p class="text-[8px] font-black text-orange-400 uppercase tracking-widest leading-tight text-center">Solo el originador de la unidad o el Admin pueden modificar este expediente.</p>
                                </div>
                            `}

                            <button onclick="registrarVenta()" class="w-full py-5 sm:py-6 bg-black text-white rounded-3xl font-black uppercase italic text-lg sm:text-xl shadow-xl hover:bg-[#FF8801] transition-all flex items-center justify-center gap-3">
                                <span>REGISTRAR VENTA</span>
                                <i class="fa-solid fa-fire text-sm"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

       function registrarVenta() {
    // Redirigimos a venta.html pasando ID, Marca, Modelo y Precio base por URL
    const params = new URLSearchParams({
        id: vehiculoActual.id,
        marca: vehiculoActual.marca,
        modelo: vehiculoActual.modelo,
        precio: vehiculoActual.precio_venta
    });
    window.location.href = `venta.html?${params.toString()}`;
}

        function getFotoUrl(path) {
            if (!path) return 'https://via.placeholder.com/800?text=MULTIAMERICA';
            if (path.startsWith('http')) return path;
            return _supabase.storage.from('autos').getPublicUrl(path).data.publicUrl;
        }

        function changeView(src, btn) {
            document.getElementById('main-view').src = src;
            document.querySelectorAll('.thumb-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function generarFichaPDF() {
            if (!vehiculoActual) return;
            const btn = document.getElementById('btn-pdf');
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Procesando...`;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const u = vehiculoActual;

            doc.setFillColor(0, 0, 0);
            doc.rect(0, 0, 210, 45, 'F');
            doc.setTextColor(255, 136, 1);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(26);
            doc.text("MULTIAMERICA", 20, 22);
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(9);
            doc.text(`FICHA TÉCNICA | REGISTRADO POR: ${u.creado_por ? u.creado_por.toUpperCase() : 'CENTRAL'}`, 20, 32);

            if (u.fotos && u.fotos[0]) {
                try {
                    const imgUrl = getFotoUrl(u.fotos[0]);
                    const img = new Image();
                    img.src = imgUrl;
                    await new Promise((resolve) => { img.onload = resolve; });
                    const pdfWidth = 170; const pdfHeight = 100;
                    const imgRatio = img.width / img.height; const pdfRatio = pdfWidth / pdfHeight;
                    let drawW, drawH;
                    if (imgRatio > pdfRatio) { drawW = pdfWidth; drawH = pdfWidth / imgRatio; } 
                    else { drawH = pdfHeight; drawW = pdfHeight * imgRatio; }
                    doc.addImage(img, 'JPEG', 20 + (pdfWidth - drawW) / 2, 55 + (pdfHeight - drawH) / 2, drawW, drawH);
                } catch (e) { console.error(e); }
            }

            doc.setTextColor(0, 0, 0);
            doc.setFontSize(28);
            doc.text(`${u.marca} ${u.modelo}`, 20, 172);
            doc.setFontSize(18);
            doc.setTextColor(255, 136, 1);
            doc.text(`PRECIO: $${u.precio_venta?.toLocaleString()} USD`, 20, 185);

            doc.setDrawColor(240, 240, 240);
            doc.line(20, 195, 190, 195);

            let yPos = 205;
            doc.setFontSize(10);
            Object.entries(u).forEach(([key, value]) => {
                if (value && value !== "" && !CAMPOS_OMITIR.includes(key.toLowerCase())) {
                    doc.setFont("helvetica", "bold");
                    doc.setTextColor(150, 150, 150);
                    doc.text(`${key.replace(/_/g, ' ').toUpperCase()}:`, 20, yPos);
                    doc.setFont("helvetica", "normal");
                    doc.setTextColor(0, 0, 0);
                    const val = typeof value === 'number' ? value.toLocaleString() : value.toString();
                    doc.text(val, 85, yPos);
                    yPos += 9;
                    if (yPos > 280) { doc.addPage(); yPos = 25; }
                }
            });

            doc.save(`Ficha_${u.marca}_${u.modelo}.pdf`);
            btn.innerHTML = `<i class="fa-solid fa-file-pdf"></i> Generar Ficha Pretext`;
        }

        document.addEventListener('DOMContentLoaded', cargarDetalle);
    </script>
</body>
</html>
